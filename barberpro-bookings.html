<!DOCTYPE html><html lang="tr" data-theme="dark"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="meta_barberpro_online_rezervasyon_yönetimi" data-i18n-attr="content">BarberPro — Online Rezervasyon Yönetimi</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#a855f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BarberPro">
<link rel="apple-touch-icon" href="assets/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/dashboard.css">
<style>
/* ── Purple Theme Overrides ── */
:root, [data-theme="dark"] {
  --teal-50: #f5f3ff; --teal-100: #ede9fe; --teal-200: #ddd6fe; --teal-300: #c4b5fd;
  --teal-400: #a78bfa; --teal-500: #8b5cf6; --teal-600: #7c3aed; --teal-700: #6d28d9;
  --teal-800: #5b21b6; --teal-900: #4c1d95;
  --amber-500: #f59e0b; --amber-600: #d97706;
  --shadow-glow: rgba(139,92,246,0.25);
}
[data-theme="dark"] ::selection { background:var(--purple-700,#6d28d9); color:var(--purple-100,#ede9fe); }

.sidebar-brand-icon {
  background:linear-gradient(135deg,var(--teal-500),var(--teal-700)) !important;
}
.sidebar-link.active {
  background:linear-gradient(135deg,var(--teal-500),var(--teal-600)) !important;
}

/* ── Page-specific Styles ── */
.booking-summary-grid {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:var(--space-5);
  margin-bottom:var(--space-6);
}
@media (max-width:1024px) { .booking-summary-grid { grid-template-columns:repeat(2,1fr); } }
@media (max-width:480px) { .booking-summary-grid { grid-template-columns:1fr; } }

.summary-card {
  background:var(--bg-card);
  border:1px solid var(--border-color);
  border-radius:var(--radius-lg);
  padding:var(--space-5);
  transition:all var(--duration-normal) var(--ease-out);
  position:relative; overflow:hidden;
}
.summary-card:hover {
  transform:translateY(-2px);
  border-color:rgba(139,92,246,0.3);
  box-shadow:var(--shadow-md);
}
.summary-card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:3px;
  background:linear-gradient(90deg,var(--teal-500),var(--teal-400));
  border-radius:var(--radius-lg) var(--radius-lg) 0 0;
}
.summary-card .summary-icon {
  width:44px; height:44px; border-radius:var(--radius-md);
  display:flex; align-items:center; justify-content:center;
  font-size:var(--text-xl); margin-bottom:var(--space-3);
  background:linear-gradient(135deg,rgba(139,92,246,0.15),rgba(167,139,250,0.1));
  color:var(--teal-400);
}
.summary-card .summary-value {
  font-size:var(--text-3xl); font-weight:700; color:var(--text-primary);
  line-height:1.2; letter-spacing:-0.02em;
}
.summary-card .summary-label {
  font-size:var(--text-sm); color:var(--text-muted); margin-top:2px;
}
.summary-card .summary-change {
  display:inline-flex; align-items:center; gap:4px;
  font-size:var(--text-xs); font-weight:600;
  margin-top:var(--space-2); padding:2px 8px; border-radius:9999px;
}
.summary-change.up { background:rgba(16,185,129,0.15); color:var(--success-500); }
.summary-change.down { background:rgba(244,63,94,0.15); color:var(--error-500); }

/* ── Tabs ── */
.booking-tabs {
  display:flex; gap:var(--space-1);
  border-bottom:1px solid var(--border-color);
  margin-bottom:var(--space-5);
}
.booking-tab {
  padding:var(--space-3) var(--space-5);
  font-size:var(--text-sm); font-weight:600;
  color:var(--text-muted);
  border-bottom:2px solid transparent;
  transition:all var(--duration-fast); cursor:pointer;
  background:none; border-radius:0; white-space:nowrap;
  display:inline-flex; align-items:center; gap:var(--space-2);
}
.booking-tab:hover { color:var(--text-secondary); }
.booking-tab.active {
  color:var(--teal-500);
  border-bottom-color:var(--teal-500);
}
.booking-tab .tab-badge {
  background:var(--bg-tertiary); color:var(--text-muted);
  font-size:var(--text-xs); font-weight:700;
  padding:2px 8px; border-radius:9999px;
}
.booking-tab.active .tab-badge {
  background:var(--teal-500); color:white;
}

/* ── Tab Panels ── */
.tab-panel { display:none; }
.tab-panel.active { display:block; animation:fadeInUp var(--duration-slow) var(--ease-out); }

/* ── Filter Bar ── */
.filter-bar {
  display:flex; align-items:center; gap:var(--space-3);
  flex-wrap:wrap;
  padding:var(--space-4);
  background:var(--bg-card);
  border:1px solid var(--border-color);
  border-radius:var(--radius-lg);
  margin-bottom:var(--space-4);
}
.filter-group { display:flex; align-items:center; gap:var(--space-2); }
.filter-group label {
  font-size:var(--text-xs); font-weight:600;
  color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em;
}
.filter-select {
  padding:6px 12px; background:var(--bg-input);
  border:1.5px solid var(--border-color); border-radius:var(--radius-md);
  font-size:var(--text-sm); color:var(--text-primary);
  outline:none; cursor:pointer; transition:all var(--duration-fast);
}
.filter-select:focus { border-color:var(--border-focus); box-shadow:0 0 0 3px var(--shadow-glow); }

/* ── Status Badges ── */
.badge-onaybekliyor { background:rgba(59,130,246,0.15); color:#3b82f6; }
.badge-onaylandi { background:rgba(16,185,129,0.15); color:var(--success-500); }
.badge-reddedildi { background:rgba(244,63,94,0.15); color:var(--error-500); }
.badge-tamamlandi { background:rgba(139,92,246,0.15); color:var(--teal-400); }
.badge-iptal { background:rgba(100,116,139,0.15); color:var(--text-muted); }

/* ── Booking Table ── */
.booking-table-wrap { overflow-x:auto; border-radius:var(--radius-lg); border:1px solid var(--border-color); }
.booking-table { width:100%; border-collapse:collapse; font-size:var(--text-sm); }
.booking-table thead th {
  background:var(--bg-secondary);
  padding:var(--space-3) var(--space-4);
  text-align:left; font-weight:600; font-size:var(--text-xs);
  text-transform:uppercase; letter-spacing:0.05em;
  color:var(--text-muted); white-space:nowrap;
}
.booking-table tbody tr {
  border-bottom:1px solid var(--border-color);
  transition:background var(--duration-fast); cursor:pointer;
}
.booking-table tbody tr:last-child { border-bottom:none; }
.booking-table tbody tr:hover { background:var(--bg-secondary); }
.booking-table tbody td {
  padding:var(--space-3) var(--space-4);
  color:var(--text-primary); vertical-align:middle;
}
.booking-table .cell-customer { font-weight:600; }
.booking-table .cell-service { font-size:var(--text-xs); color:var(--text-secondary); }
.booking-table .cell-staff-unassigned { color:var(--text-muted); font-style:italic; }
.booking-table .cell-actions { display:flex; gap:4px; }
.booking-table .action-btn {
  padding:4px 8px; border-radius:var(--radius-sm);
  font-size:var(--text-xs); font-weight:600;
  cursor:pointer; border:none; transition:all var(--duration-fast);
}
.action-btn.approve { background:var(--success-100); color:var(--success-500); }
.action-btn.approve:hover { background:var(--success-500); color:white; }
.action-btn.reject { background:var(--error-100); color:var(--error-500); }
.action-btn.reject:hover { background:var(--error-500); color:white; }
.action-btn.edit { background:var(--bg-tertiary); color:var(--text-secondary); }
.action-btn.edit:hover { background:var(--slate-300); color:var(--text-primary); }
.action-btn.detail { background:var(--info-100); color:var(--info-500); }
.action-btn.detail:hover { background:var(--info-500); color:white; }

[data-theme="dark"] .action-btn.approve { background:rgba(16,185,129,0.15); }
[data-theme="dark"] .action-btn.reject { background:rgba(244,63,94,0.15); }
[data-theme="dark"] .action-btn.edit { background:var(--bg-tertiary); }
[data-theme="dark"] .action-btn.edit:hover { background:var(--slate-600); }
[data-theme="dark"] .action-btn.detail { background:rgba(59,130,246,0.15); }

/* ── Inline Expand Row ── */
.expand-row {
  display:none;
  background:var(--bg-secondary);
  border-bottom:1px solid var(--border-color);
}
.expand-row.open { display:table-row; animation:fadeIn var(--duration-normal) var(--ease-out); }
.expand-row td { padding:var(--space-4) var(--space-6); }
.expand-content {
  display:grid; grid-template-columns:1fr 1fr; gap:var(--space-4);
}
@media (max-width:768px) { .expand-content { grid-template-columns:1fr; } }
.expand-section-title {
  font-size:var(--text-xs); font-weight:700;
  text-transform:uppercase; letter-spacing:0.05em;
  color:var(--text-muted); margin-bottom:var(--space-2);
}
.expand-note { font-size:var(--text-sm); color:var(--text-secondary); line-height:1.5; }
.expand-history-item {
  display:flex; align-items:center; gap:var(--space-3);
  padding:var(--space-2) 0;
  border-bottom:1px solid var(--border-color);
  font-size:var(--text-sm);
}
.expand-history-item:last-child { border-bottom:none; }
.expand-history-date { font-size:var(--text-xs); color:var(--text-muted); min-width:80px; }
.expand-history-service { flex:1; color:var(--text-primary); }
.expand-history-price { font-weight:600; color:var(--teal-400); }

/* ── Calendar Mini View ── */
.mini-cal {
  background:var(--bg-card);
  border:1px solid var(--border-color);
  border-radius:var(--radius-lg);
  padding:var(--space-4);
  margin-bottom:var(--space-6);
}
.mini-cal-header {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:var(--space-4);
}
.mini-cal-title { font-weight:600; font-size:var(--text-base); }
.mini-cal-nav {
  display:flex; gap:var(--space-1);
}
.mini-cal-nav-btn {
  width:28px; height:28px; border-radius:var(--radius-sm);
  display:flex; align-items:center; justify-content:center;
  color:var(--text-muted); background:var(--bg-secondary);
  border:none; cursor:pointer; transition:all var(--duration-fast);
}
.mini-cal-nav-btn:hover { color:var(--text-primary); background:var(--bg-tertiary); }
.mini-cal-days {
  display:grid; grid-template-columns:repeat(7,1fr); gap:var(--space-2);
}
.mini-cal-day {
  text-align:center; padding:var(--space-2);
  border-radius:var(--radius-md); cursor:pointer;
  transition:all var(--duration-fast); position:relative;
}
.mini-cal-day .day-name { font-size:var(--text-xs); color:var(--text-muted); }
.mini-cal-day .day-num { font-size:var(--text-base); font-weight:600; color:var(--text-primary); }
.mini-cal-day .day-count {
  font-size:var(--text-xs); font-weight:600; color:var(--teal-400);
}
.mini-cal-day:hover { background:var(--bg-tertiary); }
.mini-cal-day.active { background:linear-gradient(135deg,var(--teal-500),var(--teal-600)); }
.mini-cal-day.active .day-name,
.mini-cal-day.active .day-num,
.mini-cal-day.active .day-count { color:white; }
.mini-cal-day.today { box-shadow:inset 0 0 0 2px var(--teal-500); }
.mini-cal-day.empty { cursor:default; opacity:0.3; }
.mini-cal-day.empty:hover { background:transparent; }

/* ── Booking Form ── */
.booking-form {
  background:var(--bg-card);
  border:1px solid var(--border-color);
  border-radius:var(--radius-lg);
  padding:var(--space-6);
}
.form-section-title {
  font-size:var(--text-sm); font-weight:700;
  text-transform:uppercase; letter-spacing:0.05em;
  color:var(--text-muted); margin-bottom:var(--space-4);
  display:flex; align-items:center; gap:var(--space-2);
}
.form-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:var(--space-4); }
.form-grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-4); }
@media (max-width:768px) { .form-grid-2, .form-grid-3 { grid-template-columns:1fr; } }

/* Service multi-select chips */
.service-chips {
  display:flex; flex-wrap:wrap; gap:var(--space-2);
}
.service-chip {
  display:inline-flex; align-items:center; gap:var(--space-2);
  padding:var(--space-2) var(--space-3);
  background:var(--bg-secondary); border:1.5px solid var(--border-color);
  border-radius:var(--radius-md); font-size:var(--text-sm);
  color:var(--text-primary); cursor:pointer; transition:all var(--duration-fast);
  user-select:none;
}
.service-chip:hover { border-color:var(--slate-300); }
.service-chip.selected {
  background:linear-gradient(135deg,rgba(139,92,246,0.2),rgba(167,139,250,0.15));
  border-color:var(--teal-500); color:var(--teal-400);
  box-shadow:0 0 12px rgba(139,92,246,0.15);
}
.service-chip .chip-price { font-size:var(--text-xs); color:var(--text-muted); font-weight:600; }
.service-chip.selected .chip-price { color:var(--teal-300); }

/* Time slots */
.time-slots {
  display:grid; grid-template-columns:repeat(8,1fr); gap:var(--space-2);
}
@media (max-width:1024px) { .time-slots { grid-template-columns:repeat(6,1fr); } }
@media (max-width:640px) { .time-slots { grid-template-columns:repeat(4,1fr); } }
.time-slot {
  padding:var(--space-2) var(--space-1);
  text-align:center; font-size:var(--text-xs); font-weight:600;
  border-radius:var(--radius-md); cursor:pointer;
  border:1.5px solid var(--border-color);
  background:var(--bg-secondary); color:var(--text-primary);
  transition:all var(--duration-fast);
}
.time-slot:hover:not(.disabled):not(.selected) {
  border-color:var(--teal-500); color:var(--teal-400);
}
.time-slot.selected {
  background:linear-gradient(135deg,var(--teal-500),var(--teal-600));
  border-color:var(--teal-500); color:white;
  box-shadow:0 4px 12px rgba(139,92,246,0.3);
}
.time-slot.disabled {
  opacity:0.4; cursor:not-allowed; background:var(--bg-tertiary);
  color:var(--text-muted); text-decoration:line-through;
}

/* Totals box */
.totals-box {
  display:flex; align-items:center; justify-content:space-between;
  padding:var(--space-4);
  background:linear-gradient(135deg,rgba(139,92,246,0.08),rgba(167,139,250,0.05));
  border:1px solid rgba(139,92,246,0.2); border-radius:var(--radius-lg);
  margin-top:var(--space-4);
}
.totals-label { font-size:var(--text-sm); color:var(--text-secondary); }
.totals-value {
  font-size:var(--text-2xl); font-weight:700;
  background:linear-gradient(135deg,var(--teal-400),var(--teal-500));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
}
.totals-meta { font-size:var(--text-xs); color:var(--text-muted); }

/* ── Detail Modal ── */
.detail-header {
  display:flex; align-items:center; gap:var(--space-4);
  margin-bottom:var(--space-4);
}
.detail-avatar {
  width:56px; height:56px; border-radius:50%;
  background:linear-gradient(135deg,var(--teal-400),var(--teal-600));
  display:flex; align-items:center; justify-content:center;
  font-size:var(--text-xl); font-weight:700; color:white;
}
.detail-info { flex:1; }
.detail-name { font-size:var(--text-lg); font-weight:700; }
.detail-meta { font-size:var(--text-sm); color:var(--text-muted); margin-top:2px; }

.detail-section {
  margin-bottom:var(--space-4);
}
.detail-section-title {
  font-size:var(--text-xs); font-weight:700;
  text-transform:uppercase; letter-spacing:0.05em;
  color:var(--text-muted); margin-bottom:var(--space-2);
}
.detail-service-list {
  display:flex; flex-direction:column; gap:var(--space-2);
}
.detail-service-item {
  display:flex; align-items:center; justify-content:space-between;
  padding:var(--space-2) var(--space-3);
  background:var(--bg-secondary); border-radius:var(--radius-md);
  font-size:var(--text-sm);
}
.detail-service-name { color:var(--text-primary); }
.detail-service-price { font-weight:600; color:var(--teal-400); }

.detail-timeline {
  display:flex; flex-direction:column; gap:var(--space-2);
  position:relative; padding-left:var(--space-6);
}
.detail-timeline::before {
  content:''; position:absolute; left:11px; top:0; bottom:0;
  width:2px; background:var(--border-color);
}
.timeline-item {
  position:relative; padding-left:var(--space-2);
}
.timeline-item::before {
  content:''; position:absolute; left:-21px; top:6px;
  width:8px; height:8px; border-radius:50%;
  background:var(--teal-500); border:2px solid var(--bg-card);
}
.timeline-item.completed::before { background:var(--success-500); }
.timeline-item.cancelled::before { background:var(--error-500); }
.timeline-item.pending::before { background:var(--info-500); }
.timeline-date { font-size:var(--text-xs); color:var(--text-muted); }
.timeline-text { font-size:var(--text-sm); color:var(--text-primary); }

.detail-total-bar {
  display:flex; align-items:center; justify-content:space-between;
  padding:var(--space-4);
  background:linear-gradient(135deg,rgba(139,92,246,0.1),rgba(167,139,250,0.05));
  border-radius:var(--radius-lg); margin-top:var(--space-4);
}
.detail-total-label { font-size:var(--text-sm); font-weight:600; color:var(--text-secondary); }
.detail-total-value {
  font-size:var(--text-2xl); font-weight:700;
  background:linear-gradient(135deg,var(--teal-400),var(--teal-500));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
}

/* ── New Customer Mini Modal ── */
.modal-sm { max-width:420px; }



/* ── Mobile Responsive Overrides (Stages 5+7) ── */
@media (max-width:1024px) {
  .sidebar { transform:translateX(-100%); width:var(--sidebar-width); }
  .sidebar.mobile-open { transform:translateX(0); }
  .main { margin-left:0 !important; }
  .header-search { display:none; }
  .widget-grid-4 { grid-template-columns:repeat(2,1fr); }
  .widget-grid-3 { grid-template-columns:repeat(2,1fr); }
}

@media (max-width:768px) {
  .page { padding:var(--space-4) var(--space-3); }
  .page-header { flex-direction:column; gap:var(--space-3); }
  .page-actions { width:100%; }
  .page-actions .btn { flex:1; min-height:44px; font-size:var(--text-sm); }
  .header { padding:0 var(--space-3); }
  .header-title { font-size:var(--text-base); }
  .widget-grid-4, .widget-grid-3, .widget-grid-2 { grid-template-columns:1fr; }
  .chart-container { height:200px; }
  .quick-actions { gap:var(--space-2); }
  .quick-action { flex:1; min-width:0; justify-content:center; min-height:44px; }
  /* Tables: scroll wrapper */
  .data-table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .data-table { min-width:640px; }
  .notifications-panel { width:100%; max-width:380px; }
  /* Touch-friendly */
  .btn, .header-btn, .sidebar-link, .quick-action { min-height:44px; }
}

@media (max-width:375px) {
  body { font-size:14px; }
  .page { padding:var(--space-3) var(--space-2); }
  .page-title { font-size:var(--text-xl); }
  .btn { padding:10px 12px; font-size:14px; min-height:44px; }
  .header-btn { width:40px; height:40px; }
  .card { padding:var(--space-4); }
  .stat-value { font-size:var(--text-xl); }
  .chart-container { height:180px; }
  .sidebar-brand-icon { width:48px; height:48px; background:linear-gradient(135deg,var(--teal-500),var(--teal-700)); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:700; color:white; flex-shrink:0; box-shadow:0 2px 8px var(--teal-glow); }
  .quick-action { font-size:13px; padding:var(--space-2) var(--space-3); }
}

/* Card view tables on very small screens */
@media (max-width:640px) {
  .data-table tbody tr {
    display:flex; flex-direction:column; padding:var(--space-3);
    border-bottom:1px solid var(--border-color); gap:4px;
  }
  .data-table tbody td { padding:2px 0; white-space:normal; font-size:14px; }
  .data-table thead { display:none; }
  .data-table tbody td::before {
    content: attr(data-label); font-weight:600; color:var(--text-muted);
    font-size:12px; display:block; margin-bottom:2px;
  }
}

</head>
<body>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<!-- Mobile Sidebar Overlay -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleMobileSidebar()"></div>

<!-- Sidebar -->

// ===== MINI CALENDAR =====
function renderMiniCal() {
  const container = document.getElementById('miniCalDays');
  const base = new Date(2026, 4, 11); // May 11, 2026
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(base);
    d.setDate(base.getDate() + i + calOffset);
    const dateStr = d.toISOString().split('T')[0];
    const dayNames = ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
    const dayName = dayNames[d.getDay() === 0 ? 6 : d.getDay() - 1];
    const count = bookings.filter(b => b.rawDate === dateStr).length;
    const isToday = dateStr === "2026-05-16";
    const isActive = document.getElementById('filterDate')?.value === 'today' && isToday;
    days.push(`
      <div class="mini-cal-day ${isToday ? 'today' : ''} ${isActive ? 'active' : ''}" onclick="filterByDate('${dateStr}')">
        <div class="day-name">${dayName}</div>
        <div class="day-num">${d.getDate()}</div>
        <div class="day-count">${count} rez</div>
      </div>
    `);
  }
  container.innerHTML = days.join('');
}
function shiftCal(dir) {
  calOffset += dir * 7;
  renderMiniCal();
}
function filterByDate(dateStr) {

  applyFilters();
  renderMiniCal();
}

// ===== FILTERS =====
function applyFilters() {
  const status = document.getElementById('filterStatus').value;
  const source = document.getElementById('filterSource').value;
  const service = document.getElementById('filterService').value;
  const dateFilter = document.getElementById('filterDate').value;
  const search = document.getElementById('filterSearch').value.toLowerCase();

  let filtered = bookings;

  if (status !== 'all') filtered = filtered.filter(b => b.status === status);
  if (source !== 'all') filtered = filtered.filter(b => b.source === source);
  if (service !== 'all') filtered = filtered.filter(b => b.service === service);
  if (dateFilter === 'today') filtered = filtered.filter(b => b.rawDate === "2026-05-16");
  if (dateFilter === 'tomorrow') filtered = filtered.filter(b => b.rawDate === "2026-05-17");
  if (dateFilter === 'thisweek') filtered = filtered.filter(b => b.rawDate >= "2026-05-16" && b.rawDate <= "2026-05-22");
  if (search) filtered = filtered.filter(b =>
    b.customer.toLowerCase().includes(search) ||
    b.service.toLowerCase().includes(search) ||
    b.staff.toLowerCase().includes(search) ||
    b.notes.toLowerCase().includes(search)
  );

  renderBookings(filtered);
}

// ===== ACTIONS =====
function approveBooking(id) {
  const b = bookings.find(x => x.id === id);
  if (b) { b.status = "Onaylandı"; showToast(`${b.customer} rezervasyonu onaylandı`, 'success'); }
  applyFilters(); updateSummaryCards();
}
function rejectBooking(id) {
  const b = bookings.find(x => x.id === id);
  if (b) { b.status = "Reddedildi"; showToast(`${b.customer} rezervasyonu reddedildi`, 'warning'); }
  applyFilters(); updateSummaryCards();
}
function completeBooking(id) {
  const b = bookings.find(x => x.id === id);
  if (b) { b.status = "Tamamlandı"; showToast(`${b.customer} rezervasyonu tamamlandı`, 'success'); }
  applyFilters(); updateSummaryCards();
}
function cancelBooking(id) {
  const b = bookings.find(x => x.id === id);
  if (b) { b.status = "İptal"; showToast(`${b.customer} rezervasyonu iptal edildi`, 'error'); }
  applyFilters(); updateSummaryCards();
}

// ===== CREATE BOOKING FORM =====
function handleCustomerChange() {
  const val = document.getElementById('cbCustomer').value;
  if (val === 'new') {
    openModal('newCustomerModal');
    document.getElementById('cbCustomer').value = '';
  }
  updateSubmitButton();
}

function toggleServiceChip(el) {
  el.classList.toggle('selected');
  const service = el.dataset.service;
  const price = parseInt(el.dataset.price);
  const duration = parseInt(el.dataset.duration);

  if (el.classList.contains('selected')) {
    selectedServices.push({ service, price, duration });
  } else {
    selectedServices = selectedServices.filter(s => s.service !== service);
  }
  updateTotals();
  updateSubmitButton();
}

function updateTotals() {
  const totalPrice = selectedServices.reduce((sum, s) => sum + s.price, 0);
  const totalDuration = selectedServices.reduce((sum, s) => sum + s.duration, 0);
  document.getElementById('totalsServices').textContent = `${selectedServices.length} hizmet — ${totalDuration} dakika`;
  document.getElementById('totalsPrice').textContent = `€${totalPrice}`;
}

function renderTimeSlots() {
  const dateVal = document.getElementById('cbDate').value;
  const range = document.getElementById('cbTimeRange').value;
  const container = document.getElementById('timeSlots');

  if (!dateVal) {
    container.innerHTML = '<div style="color:var(--text-muted); font-size:var(--text-sm);">Lütfen önce bir tarih seçin.</div>';
    return;
  }

  const busy = busySlots[dateVal] || [];
  let slots = [];
  const allSlots = ["09:00","09:30","10:00","10:30","11:00","11:30","12:00","12:30","13:00","13:30","14:00","14:30","15:00","15:30","16:00","16:30","17:00","17:30","18:00","18:30","19:00","19:30"];

  if (range === 'morning') slots = allSlots.filter(s => parseInt(s) < 12);
  else if (range === 'afternoon') slots = allSlots.filter(s => parseInt(s) >= 12 && parseInt(s) < 17);
  else if (range === 'evening') slots = allSlots.filter(s => parseInt(s) >= 17);
  else slots = allSlots;

  container.innerHTML = slots.map(s => {
    const isBusy = busy.includes(s);
    const isSelected = selectedTimeSlot === s;
    return `<div class="time-slot ${isBusy ? 'disabled' : ''} ${isSelected ? 'selected' : ''}" onclick="${isBusy ? '' : `selectTimeSlot('${s}')`}">${s}</div>`;
  }).join('');
}

function selectTimeSlot(slot) {
  selectedTimeSlot = slot;
  renderTimeSlots();
  updateSubmitButton();
}

function updateSubmitButton() {
  const hasCustomer = document.getElementById('cbCustomer').value && document.getElementById('cbCustomer').value !== 'new';
  const hasServices = selectedServices.length > 0;
  const hasStaff = document.getElementById('cbStaff').value;
  const hasDate = document.getElementById('cbDate').value;
  const hasTime = selectedTimeSlot;

  const btn = document.getElementById('submitBtn');
  btn.disabled = !(hasCustomer && hasServices && hasStaff && hasDate && hasTime);
}

function validateBookingFormGuard() {
  const customer = document.getElementById('cbCustomer');
  const staff = document.getElementById('cbStaff');
  const date = document.getElementById('cbDate');
  let valid = true;
  if (!customer || !customer.value || customer.value === '') {
    if (customer) customer.style.borderColor = 'var(--red-500,#ef4444)';
    valid = false;
  } else if (customer.value === 'new') {
    const ncName = document.getElementById('ncName');
    const ncPhone = document.getElementById('ncPhone');
    if (ncName && !ncName.value.trim()) { ncName.style.borderColor = 'var(--red-500,#ef4444)'; valid = false; }
    if (ncPhone) {
      const digits = ncPhone.value.replace(/\D/g,'');
      if (digits.length < 7) { ncPhone.style.borderColor = 'var(--red-500,#ef4444)'; valid = false; }
    }
  }
  if (!staff || !staff.value) { if (staff) staff.style.borderColor = 'var(--red-500,#ef4444)'; valid = false; }
  if (!date || !date.value) { if (date) date.style.borderColor = 'var(--red-500,#ef4444)'; valid = false; }
  if (typeof selectedServices !== 'undefined' && selectedServices.length === 0) {
    valid = false;
    const chips = document.getElementById('serviceChips');
    if (chips) chips.scrollIntoView({behavior:'smooth',block:'center'});
  }
  if (!valid) {
    if (typeof showToast === 'function') showToast('Lütfen zorunlu alanları doğru şekilde doldurun.', 'error');
    else alert('Lütfen zorunlu alanları doğru şekilde doldurun.');
  }
  return valid;
}

function submitBooking(e) {
  e.preventDefault();
  if (!validateFormInputs('createBookingForm') && !validateBookingFormGuard()) return;
  const customer = document.getElementById('cbCustomer').value;
  const staff = document.getElementById('cbStaff').value;
  const date = document.getElementById('cbDate').value;
  const notes = document.getElementById('cbNotes').value;
  const totalPrice = selectedServices.reduce((sum, s) => sum + s.price, 0);
  const serviceNames = selectedServices.map(s => s.service).join(', ');

  // Add to bookings
  const newId = Math.max(...bookings.map(b => b.id)) + 1;
  const dateObj = new Date(date);
  const day = dateObj.getDate();
  const monthNames = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  const dateStr = `${day} ${monthNames[dateObj.getMonth()]} 2026`;

  bookings.unshift({
    id: newId,
    date: dateStr,
    time: selectedTimeSlot,
    rawDate: date,
    customer: customer,
    phone: document.getElementById('cbPhone').value || '+32 470 00 00 00',
    service: serviceNames,
    price: totalPrice,
    staff: staff,
    status: "Onay Bekliyor",
    source: "Web",
    notes: notes || "Yeni rezervasyon — manuel oluşturuldu."
  });

  showToast(`Rezervasyon oluşturuldu: ${customer} — ${serviceNames} @ ${selectedTimeSlot}`, 'success');
  resetForm();
  switchTab('incoming');
  applyFilters();
  updateSummaryCards();
  renderMiniCal();
}

function resetForm() {
  document.getElementById('createBookingForm').reset();
  selectedServices = [];
  selectedTimeSlot = null;
  document.querySelectorAll('.service-chip').forEach(c => c.classList.remove('selected'));
  updateTotals();
  updateSubmitButton();
  renderTimeSlots();
}

// ===== NEW CUSTOMER =====
function saveNewCustomer() {
  const ad = document.getElementById('ncAd').value;
  const soyad = document.getElementById('ncSoyad').value;
  if (!ad || !soyad) { showToast('Ad ve soyad zorunlu', 'error'); return; }

  const fullName = `${ad} ${soyad}`;
  const select = document.getElementById('cbCustomer');
  const option = document.createElement('option');
  option.value = fullName;
  option.textContent = fullName;
  select.insertBefore(option, select.children[2]);
  select.value = fullName;

  document.getElementById('cbPhone').value = document.getElementById('ncTel').value;
  closeModal('newCustomerModal');
  showToast(`Müşteri eklendi: ${fullName}`, 'success');
  updateSubmitButton();
}

// ===== MODAL UTILS =====
function openModal(id) {
  document.getElementById(id).classList.add('active');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

// Close on overlay click / ESC
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', (e) => {
    if(e.target === overlay) overlay.classList.remove('active');
  });
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape') document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active'));
});

// ===== TOAST =====
function showToast(message, type = 'success') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
  toast.innerHTML = `
    <span class="toast-icon">${icons[type] || 'ℹ️'}</span>
    <div class="toast-content">
      <div class="toast-message">${message}</div>
    </div>
    <span class="toast-close" onclick="this.parentElement.remove()">✕</span>
    <div class="toast-progress"></div>
  `;
  container.appendChild(toast);
  setTimeout(() => {
    toast.classList.add('exit');
    setTimeout(() => toast.remove(), 350);
  }, 4000);
}

// ===== SIDEBAR =====
function toggleMobileSidebar() {
  document.getElementById('sidebar').classList.toggle('mobile-open');
  document.getElementById('sidebarOverlay').classList.toggle('active');
}

// ===== NOTIFICATIONS =====
function showNotifications() {
  document.getElementById('notificationsPanel').classList.toggle('open');
}

// ===== THEME =====
function toggleTheme() {
  const html = document.documentElement;
  html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
}

let currentLang = localStorage.getItem('barberpro_lang') || 'tr';
function switchLang(lang) {
  currentLang = lang;
  localStorage.setItem('barberpro_lang', lang);
  document.documentElement.lang = lang;
  applyTranslations();
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
}
function applyTranslations() {
  const dict = i18n[currentLang];
  if (!dict) return;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    const attr = el.dataset.i18nAttr;
    const val = dict[key];
    if (val === undefined) return;
    if (attr) { el.setAttribute(attr, val); }
    else if (el.tagName === 'TITLE') { el.textContent = val; }
    else { el.textContent = val; }
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.dataset.i18nPlaceholder;
    if (dict[key] !== undefined) el.placeholder = dict[key];
  });
}
if (!document.getElementById('lang-style')) {
  const st = document.createElement('style');
  st.id = 'lang-style';
  st.textContent = '.lang-btn.active{background:var(--teal-600)!important;color:white!important;}.lang-btn:hover{color:var(--text-primary)!important;}';
  document.head.appendChild(st);
}
switchLang(currentLang);
</script>

<!-- ===== FORM VALIDATION & MODAL GUARD ===== -->
<script>
function validateFormInputs(container) {
  const root = typeof container === 'string' ? document.getElementById(container) : container;
  if (!root) return true;
  const inputs = root.querySelectorAll('input, select, textarea');
  let valid = true;
  let firstError = null;
  const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  inputs.forEach(function(el) {
    const isRequired = el.hasAttribute('required') || el.dataset.required === 'true';
    const val = el.value ? el.value.trim() : '';
    if (isRequired && !val) {
      el.style.borderColor = 'var(--red-500, #ef4444)';
      valid = false;
      if (!firstError) firstError = el;
      return;
    }
    if (el.type === 'email' || el.dataset.validate === 'email') {
      if (val && !emailRe.test(val)) {
        el.style.borderColor = 'var(--red-500, #ef4444)';
        valid = false;
        if (!firstError) firstError = el;
        return;
      }
    }
    if (el.type === 'tel' || el.dataset.validate === 'phone') {
      const digits = val.replace(/\D/g, '');
      if (val && digits.length < 7) {
        el.style.borderColor = 'var(--red-500, #ef4444)';
        valid = false;
        if (!firstError) firstError = el;
        return;
      }
    }
    el.style.borderColor = '';
  });
  if (!valid && firstError) {
    firstError.focus();
    if (typeof showToast === 'function') {
      showToast('Lütfen zorunlu alanları doğru şekilde doldurun.', 'error');
    } else {
      alert('Lütfen zorunlu alanları doğru şekilde doldurun.');
    }
  }
  return valid;
}
function guardModals() {
  document.querySelectorAll('.modal-overlay').forEach(function(m) {
    if (!m.classList.contains('active')) {
      m.style.opacity = '0';
      m.style.visibility = 'hidden';
    }
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      document.querySelectorAll('.modal-overlay.active').forEach(function(m) {
        m.classList.remove('active');
        m.style.opacity = '0';
        m.style.visibility = 'hidden';
      });
    }
  });
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', guardModals);
} else {
  guardModals();
}
