<!DOCTYPE html><html lang="tr" data-theme="dark"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">

<style>
/* ── Purple Theme Overrides ── */
:root, [data-theme="dark"] {
  --teal-50: #f0fdfa; --teal-100: #ccfbf1; --teal-200: #c4b5fd; --teal-300: #c4b5fd;
  --teal-400: #a78bfa; --teal-500: #8b5cf6; --teal-600: #7c3aed; --teal-700: #6d28d9;
  --teal-800: #6d28d9; --teal-900: #6d28d9;
  --amber-500: #f59e0b; --amber-600: #d97706;
  --shadow-glow: rgba(139,92,246,0.25);
}
[data-theme="dark"] ::selection { background:var(--purple-700,#6d28d9); color:var(--purple-100,#ede9fe); }

/* ── POS Layout ── */
.pos-container {
  display: grid;
  grid-template-columns: 1fr 380px 340px;
  gap: var(--space-4);
  align-items: start;
}
@media (max-width: 1280px) {
  .pos-container { grid-template-columns: 1fr 340px; }
  .pos-payment-col { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
}
@media (max-width: 1024px) {
  .pos-container { grid-template-columns: 1fr; }
  .pos-payment-col { grid-column: auto; display: block; }
}

/* ── Product Grid ── */
.pos-search {
  position: relative;
  margin-bottom: var(--space-4);
}
.pos-search input {
  width: 100%; padding: 12px 14px 12px 42px;
  background: var(--bg-input); color: var(--text-primary);
  border: 1.5px solid var(--border-color); border-radius: var(--radius-lg);
  font-size: var(--text-sm); outline: none; transition: all var(--duration-normal);
}
.pos-search input:focus {
  border-color: var(--teal-500); box-shadow: 0 0 0 3px var(--shadow-glow);
}
.pos-search svg {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  color: var(--text-muted); pointer-events: none;
}

.pos-tabs {
  display: flex; gap: var(--space-1); margin-bottom: var(--space-4);
  border-bottom: 1px solid var(--border-color);
}
.pos-tab {
  padding: var(--space-2) var(--space-4); font-size: var(--text-sm); font-weight: 500;
  color: var(--text-muted); border-bottom: 2px solid transparent;
  transition: all var(--duration-fast); cursor: pointer; white-space: nowrap;
  background: none; border-radius: 0;
}
.pos-tab:hover { color: var(--text-secondary); }
.pos-tab.active { color: var(--teal-500); border-bottom-color: var(--teal-500); }

.pos-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: var(--space-3);
  max-height: 520px; overflow-y: auto; padding-right: 4px;
}
.pos-item {
  background: var(--bg-card); border: 1.5px solid var(--border-color);
  border-radius: var(--radius-lg); padding: var(--space-4);
  text-align: center; cursor: pointer; transition: all var(--duration-fast);
  position: relative; overflow: hidden; user-select: none;
}
.pos-item:hover {
  border-color: var(--teal-500); transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(139,92,246,0.15);
}
.pos-item:active { transform: scale(0.98); }
.pos-item-icon {
  width: 48px; height: 48px; border-radius: var(--radius-md);
  background: linear-gradient(135deg, rgba(139,92,246,0.15), rgba(167,139,250,0.1));
  display: flex; align-items: center; justify-content: center;
  font-size: var(--text-xl); margin: 0 auto var(--space-3);
}
.pos-item-name {
  font-size: var(--text-sm); font-weight: 600; color: var(--text-primary);
  line-height: 1.3; margin-bottom: 2px;
}
.pos-item-price {
  font-size: var(--text-base); font-weight: 700; color: var(--teal-400);
}
.pos-item-badge {
  position: absolute; top: 8px; right: 8px;
  padding: 2px 8px; border-radius: 9999px;
  font-size: 10px; font-weight: 700;
}
.pos-item-badge.paket { background: linear-gradient(135deg, var(--amber-500), var(--amber-600)); color: white; }
.pos-item-badge.populer { background: rgba(139,92,246,0.2); color: var(--teal-400); }

/* ── Cart ── */
.pos-cart {
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: var(--radius-lg); display: flex; flex-direction: column;
  height: calc(100vh - 180px); min-height: 520px;
}
.pos-cart-header {
  padding: var(--space-4) var(--space-5);
  border-bottom: 1px solid var(--border-color);
  display: flex; align-items: center; justify-content: space-between;
}
.pos-cart-title { font-size: var(--text-lg); font-weight: 700; }
.pos-cart-count { font-size: var(--text-xs); color: var(--text-muted); }
.pos-cart-body {
  flex: 1; overflow-y: auto; padding: var(--space-3) var(--space-4);
}
.pos-cart-item {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-3); border-radius: var(--radius-md);
  background: var(--bg-secondary); margin-bottom: var(--space-2);
  transition: background var(--duration-fast);
}
.pos-cart-item:hover { background: var(--bg-tertiary); }
.pos-cart-item-info { flex: 1; min-width: 0; }
.pos-cart-item-name { font-size: var(--text-sm); font-weight: 600; color: var(--text-primary); }
.pos-cart-item-meta { font-size: var(--text-xs); color: var(--text-muted); margin-top: 1px; }
.pos-cart-item-qty {
  display: flex; align-items: center; gap: var(--space-1);
}
.pos-qty-btn {
  width: 28px; height: 28px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-tertiary); color: var(--text-secondary);
  font-size: var(--text-sm); font-weight: 700; cursor: pointer;
  border: none; transition: all var(--duration-fast);
}
.pos-qty-btn:hover { background: var(--teal-500); color: white; }
.pos-cart-item-price {
  font-size: var(--text-sm); font-weight: 700; color: var(--teal-400);
  min-width: 56px; text-align: right;
}
.pos-cart-item-del {
  width: 28px; height: 28px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); cursor: pointer; border: none; background: none;
  transition: all var(--duration-fast);
}
.pos-cart-item-del:hover { background: var(--error-100); color: var(--error-500); }
[data-theme="dark"] .pos-cart-item-del:hover { background: rgba(244,63,94,0.15); }

.pos-cart-footer {
  padding: var(--space-4) var(--space-5);
  border-top: 1px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
}
.pos-cart-line {
  display: flex; justify-content: space-between; align-items: center;
  font-size: var(--text-sm); margin-bottom: var(--space-2);
}
.pos-cart-line .label { color: var(--text-secondary); }
.pos-cart-line .value { font-weight: 600; color: var(--text-primary); }
.pos-cart-line.total {
  font-size: var(--text-xl); font-weight: 700;
  border-top: 1px solid var(--border-color); padding-top: var(--space-3); margin-top: var(--space-2);
}
.pos-cart-line.total .value { color: var(--teal-400); }

/* ── Customer Selector ── */
.pos-customer {
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--border-color);
}
.pos-customer-label {
  font-size: var(--text-xs); font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: var(--space-2);
}
.pos-customer-row {
  display: flex; gap: var(--space-2); align-items: center;
}
.pos-customer-select {
  flex: 1; padding: 8px 12px; background: var(--bg-input); color: var(--text-primary);
  border: 1.5px solid var(--border-color); border-radius: var(--radius-md);
  font-size: var(--text-sm); outline: none;
}
.pos-customer-select:focus { border-color: var(--teal-500); box-shadow: 0 0 0 3px var(--shadow-glow); }
.pos-customer-btn {
  padding: 8px 12px; background: var(--bg-tertiary); color: var(--text-secondary);
  border: 1px solid var(--border-color); border-radius: var(--radius-md);
  font-size: var(--text-xs); font-weight: 600; cursor: pointer; white-space: nowrap;
  transition: all var(--duration-fast);
}
.pos-customer-btn:hover { background: var(--teal-500); color: white; border-color: var(--teal-500); }

.pos-appointment-link {
  padding: var(--space-2) var(--space-4);
  border-bottom: 1px solid var(--border-color);
  display: flex; align-items: center; gap: var(--space-2);
}
.pos-appointment-link select {
  flex: 1; padding: 6px 10px; background: var(--bg-input); color: var(--text-primary);
  border: 1.5px solid var(--border-color); border-radius: var(--radius-md);
  font-size: var(--text-xs); outline: none;
}
.pos-notes {
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--border-color);
}
.pos-notes textarea {
  width: 100%; padding: 8px 12px; background: var(--bg-input); color: var(--text-primary);
  border: 1.5px solid var(--border-color); border-radius: var(--radius-md);
  font-size: var(--text-xs); resize: vertical; min-height: 60px; outline: none;
}
.pos-notes textarea:focus { border-color: var(--teal-500); box-shadow: 0 0 0 3px var(--shadow-glow); }

/* ── Payment Panel ── */
.pos-payment {
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: var(--radius-lg); padding: var(--space-5);
}
.pos-payment-title {
  font-size: var(--text-lg); font-weight: 700; margin-bottom: var(--space-4);
  display: flex; align-items: center; gap: var(--space-2);
}
.pos-payment-methods {
  display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3);
  margin-bottom: var(--space-4);
}
.pos-pay-btn {
  padding: var(--space-4); border-radius: var(--radius-lg);
  background: var(--bg-secondary); border: 1.5px solid var(--border-color);
  color: var(--text-primary); font-size: var(--text-sm); font-weight: 600;
  cursor: pointer; transition: all var(--duration-fast); text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: var(--space-2);
}
.pos-pay-btn:hover { border-color: var(--teal-500); background: rgba(139,92,246,0.08); }
.pos-pay-btn.active {
  border-color: var(--teal-500); background: rgba(139,92,246,0.12);
  box-shadow: 0 0 0 2px var(--shadow-glow);
}
.pos-pay-btn .emoji { font-size: var(--text-xl); }
.pos-pay-btn .label { font-size: var(--text-xs); color: var(--text-muted); }

.pos-split-payment {
  background: var(--bg-secondary); border-radius: var(--radius-md);
  padding: var(--space-3); margin-bottom: var(--space-4);
}
.pos-split-row {
  display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2);
}
.pos-split-row:last-child { margin-bottom: 0; }
.pos-split-label { font-size: var(--text-xs); color: var(--text-muted); width: 80px; flex-shrink: 0; }
.pos-split-input {
  flex: 1; padding: 6px 10px; background: var(--bg-input); color: var(--text-primary);
  border: 1.5px solid var(--border-color); border-radius: var(--radius-md);
  font-size: var(--text-sm); outline: none;
}
.pos-split-input:focus { border-color: var(--teal-500); box-shadow: 0 0 0 3px var(--shadow-glow); }

.pos-points {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--space-3); background: var(--bg-secondary);
  border-radius: var(--radius-md); margin-bottom: var(--space-4);
}
.pos-points-info { font-size: var(--text-sm); }
.pos-points-value { font-weight: 700; color: var(--amber-500); }

.pos-change {
  padding: var(--space-3); background: var(--bg-secondary);
  border-radius: var(--radius-md); margin-bottom: var(--space-4);
}
.pos-change-label { font-size: var(--text-xs); color: var(--text-muted); margin-bottom: var(--space-1); }
.pos-change-value { font-size: var(--text-2xl); font-weight: 700; color: var(--teal-400); }

.pos-action-btns {
  display: flex; flex-direction: column; gap: var(--space-3);
}
.pos-btn-complete {
  width: 100%; padding: var(--space-4);
  background: linear-gradient(135deg, var(--teal-500), var(--teal-600));
  color: white; font-size: var(--text-lg); font-weight: 700;
  border: none; border-radius: var(--radius-lg); cursor: pointer;
  box-shadow: 0 4px 14px rgba(20,184,166,0.35);
  transition: all var(--duration-normal);
}
.pos-btn-complete:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(20,184,166,0.45), 0 0 0 3px rgba(20,184,166,0.15);
}
.pos-btn-complete:active { transform: translateY(0); }
.pos-btn-draft {
  width: 100%; padding: var(--space-3);
  background: var(--bg-elevated); color: var(--text-secondary);
  font-size: var(--text-sm); font-weight: 600;
  border: 1.5px solid var(--border-color); border-radius: var(--radius-lg);
  cursor: pointer; transition: all var(--duration-fast);
}
.pos-btn-draft:hover { background: var(--bg-tertiary); color: var(--text-primary); }

/* ── Daily Summary ── */
.daily-summary {
  margin-top: var(--space-6);
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: var(--radius-lg); overflow: hidden;
}
.daily-summary-header {
  padding: var(--space-4) var(--space-5);
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; user-select: none;
  transition: background var(--duration-fast);
}
.daily-summary-header:hover { background: var(--bg-secondary); }
.daily-summary-title { font-size: var(--text-lg); font-weight: 700; display: flex; align-items: center; gap: var(--space-2); }
.daily-summary-toggle { font-size: var(--text-xl); color: var(--text-muted); transition: transform var(--duration-fast); }
.daily-summary.open .daily-summary-toggle { transform: rotate(180deg); }
.daily-summary-body {
  max-height: 0; overflow: hidden;
  transition: max-height var(--duration-slow) var(--ease-out);
}
.daily-summary.open .daily-summary-body { max-height: 800px; }
.daily-summary-content { padding: 0 var(--space-5) var(--space-5); }

.daily-stats {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-4);
  margin-bottom: var(--space-5);
}
@media (max-width: 768px) { .daily-stats { grid-template-columns: repeat(2, 1fr); } }
.daily-stat {
  background: var(--bg-secondary); border-radius: var(--radius-md);
  padding: var(--space-4); text-align: center;
}
.daily-stat-value { font-size: var(--text-2xl); font-weight: 700; color: var(--teal-400); }
.daily-stat-label { font-size: var(--text-xs); color: var(--text-muted); margin-top: 2px; }

/* ── Receipt Print Preview ── */
.receipt-preview {
  background: white; color: #1e293b;
  border-radius: var(--radius-md); padding: var(--space-5);
  font-family: 'Courier New', monospace; font-size: 13px;
  max-width: 320px; margin: 0 auto;
}
.receipt-preview h3 { text-align: center; font-size: 16px; margin-bottom: 8px; }
.receipt-preview .receipt-line { display: flex; justify-content: space-between; margin-bottom: 4px; }
.receipt-preview .receipt-total { border-top: 2px dashed #ccc; margin-top: 8px; padding-top: 8px; font-weight: 700; }

/* ── POS-specific touch targets ── */
.pos-item, .pos-pay-btn, .pos-qty-btn, .pos-btn-complete {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

/* ── Animations ── */
@keyframes cartBump {
  0% { transform: scale(1); }
  30% { transform: scale(1.04); }
  60% { transform: scale(0.98); }
  100% { transform: scale(1); }
}
.cart-bump { animation: cartBump 0.35s var(--ease-spring); }

/* Scrollbar for cart */
.pos-cart-body::-webkit-scrollbar { width: 4px; }
.pos-cart-body::-webkit-scrollbar-thumb { background: var(--slate-700); border-radius: 2px; }

/* ── Modal Receipt ── */
.modal-receipt .modal { max-width: 420px; }
.receipt-options {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-3);
  margin-top: var(--space-4);
}
.receipt-option {
  padding: var(--space-4); border-radius: var(--radius-lg);
  background: var(--bg-secondary); border: 1.5px solid var(--border-color);
  text-align: center; cursor: pointer; transition: all var(--duration-fast);
  display: flex; flex-direction: column; align-items: center; gap: var(--space-2);
}
.receipt-option:hover { border-color: var(--teal-500); background: rgba(139,92,246,0.08); }
.receipt-option .emoji { font-size: var(--text-2xl); }
.receipt-option .label { font-size: var(--text-xs); color: var(--text-secondary); font-weight: 600; }

/* ── Empty cart placeholder (hidden by default since we have items) ── */
.pos-cart-empty {
  text-align: center; padding: var(--space-10) var(--space-4);
  color: var(--text-muted);
}
.pos-cart-empty-icon { font-size: var(--text-4xl); margin-bottom: var(--space-3); opacity: 0.5; }



/* ── Mobile Responsive Overrides (Stages 5+7) ── */
@media (max-width:1024px) {
  .sidebar { transform:translateX(-100%); width:var(--sidebar-width); }
  .sidebar.mobile-open { transform:translateX(0); }
  .main { margin-left:0 !important; }
  .header-search { display:none; }
  .widget-grid-4 { grid-template-columns:repeat(2,1fr); }
  .widget-grid-3 { grid-template-columns:repeat(2,1fr); }
}

@media (max-width:768px) {
  .page { padding:var(--space-4) var(--space-3); }
  .page-header { flex-direction:column; gap:var(--space-3); }
  .page-actions { width:100%; }
  .page-actions .btn { flex:1; min-height:44px; font-size:var(--text-sm); }
  .header { padding:0 var(--space-3); }
  .header-title { font-size:var(--text-base); }
  .widget-grid-4, .widget-grid-3, .widget-grid-2 { grid-template-columns:1fr; }
  .chart-container { height:200px; }
  .quick-actions { gap:var(--space-2); }
  .quick-action { flex:1; min-width:0; justify-content:center; min-height:44px; }
  /* Tables: scroll wrapper */
  .data-table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .data-table { min-width:640px; }
  .notifications-panel { width:100%; max-width:380px; }
  /* Touch-friendly */
  .btn, .header-btn, .sidebar-link, .quick-action { min-height:44px; }
}

@media (max-width:375px) {
  body { font-size:14px; }
  .page { padding:var(--space-3) var(--space-2); }
  .page-title { font-size:var(--text-xl); }
  .btn { padding:10px 12px; font-size:14px; min-height:44px; }
  .header-btn { width:40px; height:40px; }
  .card { padding:var(--space-4); }
  .stat-value { font-size:var(--text-xl); }
  .chart-container { height:180px; }
  .sidebar-brand-icon { width:48px; height:48px; background:linear-gradient(135deg,var(--teal-500),var(--teal-700)); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:700; color:white; flex-shrink:0; box-shadow:0 2px 8px var(--teal-glow); }
  .quick-action { font-size:13px; padding:var(--space-2) var(--space-3); }
}

/* Card view tables on very small screens */
@media (max-width:640px) {
  .data-table tbody tr {
    display:flex; flex-direction:column; padding:var(--space-3);
    border-bottom:1px solid var(--border-color); gap:4px;
  }
  .data-table tbody td { padding:2px 0; white-space:normal; font-size:14px; }
  .data-table thead { display:none; }
  .data-table tbody td::before {
    content: attr(data-label); font-weight:600; color:var(--text-muted);
    font-size:12px; display:block; margin-bottom:2px;
  }
}

</head>

<!-- Mobile Sidebar Overlay -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleMobileSidebar()"></div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="sidebar-brand-icon" data-i18n="div_b">B</div>
    <span class="sidebar-brand-text" data-i18n="span_barberpro">BarberPro</span>
  </div>
  <nav class="sidebar-nav">
    <div class="sidebar-section">
      <div class="sidebar-section-title" data-i18n="div_ana_menü">Ana Menü</div>
      <a class="sidebar-link" href="dashboard.html">
        <span class="icon">📊</span>
        <span class="sidebar-text" data-i18n="span_dashboard">Dashboard</span>
      </a>
      <a class="sidebar-link" href="barberpro-appointments.html">
        <span class="icon">📅</span>
        <span class="sidebar-text" data-i18n="span_randevular">Randevular</span>

// ===== RENDER PRODUCT GRID =====
function renderPosGrid(tab, filter = '') {
  const grid = document.getElementById('posGrid');
  const items = posItems[tab] || [];
  const filtered = filter
    ? items.filter(i => i.name.toLowerCase().includes(filter.toLowerCase()))
    : items;

  grid.innerHTML = filtered.map(item => `
    <div class="pos-item" onclick="addToCart('${item.id}', '${tab}')" title="${item.desc || item.name}">
      ${item.badge ? `<span class="pos-item-badge ${item.badge}">${item.badge === 'paket' ? 'PAKET' : 'POPÜLER'}</span>` : ''}
      ${item.popular && !item.badge ? `<span class="pos-item-badge populer">POPÜLER</span>` : ''}
      <div class="pos-item-icon">${item.icon}</div>
      <div class="pos-item-name">${item.name}</div>
      <div class="pos-item-price">€${item.price}</div>
    </div>
  `).join('');

  if (filtered.length === 0) {
    grid.innerHTML = `
      <div style="grid-column:1/-1; text-align:center; padding:var(--space-10); color:var(--text-muted);">
        <div style="font-size:var(--text-3xl); margin-bottom:var(--space-3);">🔍</div>
        <div style="font-size:var(--text-sm);">Sonuç bulunamadı</div>
      </div>
    `;
  }
}

function switchPosTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.pos-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.pos-tab[data-tab="${tab}"]`).classList.add('active');
  document.getElementById('posSearch').value = '';
  renderPosGrid(tab);
}

function filterPosItems(query) {
  renderPosGrid(currentTab, query);
}

// ===== CART =====
function addToCart(id, category) {
  const item = posItems[category].find(i => i.id === id);
  if (!item) return;

  const existing = cart.find(c => c.id === id && c.category === category);
  if (existing) {
    existing.qty++;
  } else {
    cart.push({ ...item, category, qty: 1 });
  }

  renderCart();
  bumpCart();
  showToast(`${item.name} sepete eklendi`, 'success');
}

function removeFromCart(index) {
  cart.splice(index, 1);
  renderCart();
}

function updateQty(index, delta) {
  cart[index].qty += delta;
  if (cart[index].qty <= 0) {
    cart.splice(index, 1);
  }
  renderCart();
}

function renderCart() {
  const body = document.getElementById('cartBody');
  const count = document.getElementById('cartCount');

  if (cart.length === 0) {
    body.innerHTML = `
      <div class="pos-cart-empty">
        <div class="pos-cart-empty-icon">🛒</div>
        <div style="font-size:var(--text-sm); font-weight:600; margin-bottom:4px;">Sepetiniz boş</div>
        <div style="font-size:var(--text-xs);">Sol panelden ürün veya hizmet ekleyin</div>
      </div>
    `;
    count.textContent = '0 ürün';
    updateTotals();
    return;
  }

  const totalItems = cart.reduce((s, c) => s + c.qty, 0);
  count.textContent = `${totalItems} ürün`;

  body.innerHTML = cart.map((item, idx) => `
    <div class="pos-cart-item">
      <div class="pos-cart-item-info">
        <div class="pos-cart-item-name">${item.name}</div>
        <div class="pos-cart-item-meta">€${item.price} / adet</div>
      </div>
      <div class="pos-cart-item-qty">
        <button class="pos-qty-btn" onclick="updateQty(${idx}, -1)">−</button>
        <span style="font-size:var(--text-sm); font-weight:600; min-width:24px; text-align:center;">${item.qty}</span>
        <button class="pos-qty-btn" onclick="updateQty(${idx}, 1)">+</button>
      </div>
      <div class="pos-cart-item-price">€${(item.price * item.qty).toFixed(2)}</div>
      <button class="pos-cart-item-del" onclick="removeFromCart(${idx})">🗑️</button>
    </div>
  `).join('');

  updateTotals();
}

function updateTotals() {
  const subtotal = cart.reduce((s, c) => s + (c.price * c.qty), 0);
  const kdv = subtotal * 0.21;
  const total = subtotal + kdv - discountAmount + tipAmount - usePointsAmount;

  document.getElementById('cartSubtotal').textContent = `€${subtotal.toFixed(2)}`;
  document.getElementById('cartKDV').textContent = `€${kdv.toFixed(2)}`;
  document.getElementById('cartDiscount').textContent = discountAmount > 0 ? `-€${discountAmount.toFixed(2)}` : '-€0,00';
  document.getElementById('cartTip').textContent = tipAmount > 0 ? `€${tipAmount.toFixed(2)}` : '€0,00';
  document.getElementById('cartTotal').textContent = `€${Math.max(0, total).toFixed(2)}`;

  // Update change section
  calculateChange();
}

function bumpCart() {
  const cartEl = document.getElementById('posCart');
  cartEl.classList.add('cart-bump');
  setTimeout(() => cartEl.classList.remove('cart-bump'), 350);
}

function clearCart() {
  cart = [];
  discountAmount = 0;
  tipAmount = 0;
  usePointsAmount = 0;
  document.getElementById('cartNotes').value = '';
  document.getElementById('cartAppointment').value = '';
  document.getElementById('usePoints').checked = false;
  renderCart();
  showToast('Sepet temizlendi', 'info');
}

// ===== CUSTOMER =====
function onCustomerChange() {
  const customer = document.getElementById('cartCustomer').value;
  const points = customerPoints[customer] || 0;
  const pointsEl = document.getElementById('customerPoints');
  const toggleEl = document.getElementById('pointsToggle');

  if (points > 0) {
    pointsEl.textContent = `€${points} puan`;
    toggleEl.style.display = 'flex';
  } else {
    pointsEl.textContent = '—';
    toggleEl.style.display = 'none';
    document.getElementById('usePoints').checked = false;
    usePointsAmount = 0;
  }
  updateTotals();
}

function togglePoints() {
  const customer = document.getElementById('cartCustomer').value;
  const points = customerPoints[customer] || 0;
  const checked = document.getElementById('usePoints').checked;

  if (checked) {
    usePointsAmount = Math.min(points, parseFloat(document.getElementById('cartTotal').textContent.replace('€', '').replace(',', '.')) || 0);
  } else {
    usePointsAmount = 0;
  }
  updateTotals();
}

function quickAddCustomer() {
  openModal('quickCustomerModal');
}

function saveQuickCustomer() {
  const name = document.getElementById('qcName').value || 'Yeni Müşteri';
  closeModal('quickCustomerModal');
  showToast(`${name} eklendi`, 'success');
  // Add to select
  const select = document.getElementById('cartCustomer');
  const option = document.createElement('option');
  option.value = 'new_' + Date.now();
  option.textContent = name + ' — Yeni';
  select.appendChild(option);
  select.value = option.value;
  onCustomerChange();
}

// ===== PAYMENT =====
function selectPayment(method) {
  currentPayment = method;
  document.querySelectorAll('.pos-pay-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.pos-pay-btn[data-method="${method}"]`).classList.add('active');

  // Show/hide split payment
  const splitEl = document.getElementById('splitPayment');
  if (method === 'puan') {
    splitEl.style.display = 'none';
    document.getElementById('changeSection').style.display = 'none';
  } else if (method === 'nakit') {
    splitEl.style.display = 'none';
    document.getElementById('changeSection').style.display = 'block';
  } else {
    splitEl.style.display = 'block';
    document.getElementById('changeSection').style.display = 'none';
  }
}

function calculateSplit() {
  const total = parseFloat(document.getElementById('cartTotal').textContent.replace('€', '').replace(',', '.')) || 0;
  const cash = parseFloat(document.getElementById('splitCash').value) || 0;
  const card = parseFloat(document.getElementById('splitCard').value) || 0;
  const bc = parseFloat(document.getElementById('splitBancontact').value) || 0;
  const remaining = total - cash - card - bc;
  const remEl = document.getElementById('splitRemaining');
  remEl.textContent = `€${remaining.toFixed(2)}`;
  remEl.style.color = remaining <= 0.01 ? 'var(--success-500)' : 'var(--error-500)';
}

function calculateChange() {
  const total = parseFloat(document.getElementById('cartTotal').textContent.replace('€', '').replace(',', '.')) || 0;
  const given = parseFloat(document.getElementById('cashGiven').value) || 0;
  const change = given - total;
  const changeEl = document.getElementById('changeAmount');
  changeEl.textContent = change >= 0 ? `€${change.toFixed(2)}` : '€0,00';
  changeEl.style.color = change >= 0 ? 'var(--success-500)' : 'var(--error-500)';
}

// ===== COMPLETE SALE =====
function completeSale() {
  if (cart.length === 0) {
    showToast('Sepet boş! Önce ürün ekleyin.', 'error');
    return;
  }

  const total = document.getElementById('cartTotal').textContent;
  const id = 'BP-' + new Date().toISOString().slice(0,10).replace(/-/g,'') + '-' + String(Math.floor(Math.random()*900)+100).padStart(3,'0');

  document.getElementById('receiptId').textContent = id;

  // Build receipt items
  const receiptItems = cart.map(c => `
    <div class="receipt-line"><span>${c.qty}x ${c.name}</span><span>€${(c.price * c.qty).toFixed(2)}</span></div>
  `).join('');

  const subtotal = cart.reduce((s, c) => s + (c.price * c.qty), 0);
  const kdv = subtotal * 0.21;

  document.getElementById('receiptItems').innerHTML = receiptItems;
  document.getElementById('receiptTotals').innerHTML = `
    <div class="receipt-line"><span>Ara Toplam</span><span>€${subtotal.toFixed(2)}</span></div>
    <div class="receipt-line"><span>KDV %21</span><span>€${kdv.toFixed(2)}</span></div>
    ${discountAmount > 0 ? `<div class="receipt-line"><span>İndirim</span><span>-€${discountAmount.toFixed(2)}</span></div>` : ''}
    ${tipAmount > 0 ? `<div class="receipt-line"><span>Bahşiş</span><span>€${tipAmount.toFixed(2)}</span></div>` : ''}
    ${usePointsAmount > 0 ? `<div class="receipt-line"><span>Puan</span><span>-€${usePointsAmount.toFixed(2)}</span></div>` : ''}
    <div class="receipt-line receipt-total"><span>TOPLAM</span><span>${total}</span></div>
    <div class="receipt-line"><span>Ödeme</span><span>${currentPayment === 'nakit' ? 'Nakit' : currentPayment === 'kredi' ? 'Kredi Kartı' : currentPayment === 'bancontact' ? 'Bancontact' : 'Puan'}</span></div>
  `;

  openModal('successModal');

  // Add to daily summary (simulated)
  const customerName = document.getElementById('cartCustomer').options[document.getElementById('cartCustomer').selectedIndex].text.split('—')[0].trim();
  const mainItem = cart[0].name;
  dailyTransactions.push({
    time: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }),
    item: mainItem,
    customer: customerName,
    staff: 'Ahmet Y.',
    amount: parseFloat(total.replace('€', '').replace(',', '.')),
    method: currentPayment === 'nakit' ? 'Nakit' : currentPayment === 'kredi' ? 'Kredi Kartı' : currentPayment === 'bancontact' ? 'Bancontact' : 'Puan'
  });
  renderDailyTable();
}

function saveDraft() {
  if (cart.length === 0) {
    showToast('Sepet boş!', 'error');
    return;
  }
  showToast('Taslak kaydedildi', 'info');
}

function sendReceipt(method) {
  const methods = { whatsapp: 'WhatsApp', email: 'E-posta', print: 'Yazıcı' };
  showToast(`Fiş ${methods[method]} gönderildi`, 'success');
}

// ===== DAILY SUMMARY =====
function toggleDailySummary() {
  document.getElementById('dailySummary').classList.toggle('open');
}

function openDailySummary() {
  document.getElementById('dailySummary').classList.add('open');
  document.getElementById('dailySummary').scrollIntoView({ behavior: 'smooth' });
}

function renderDailyTable() {
  const tbody = document.getElementById('dailyTableBody');
  tbody.innerHTML = dailyTransactions.map(t => `
    <tr>
      <td>${t.time}</td>
      <td>${t.item}</td>
      <td>${t.customer}</td>
      <td>${t.staff}</td>
      <td style="text-align:right; font-weight:600; color:var(--teal-400);">€${t.amount.toFixed(2)}</td>
      <td><span class="badge badge-neutral">${t.method}</span></td>
    </tr>
  `).join('');

  // Update stats
  const totalRevenue = dailyTransactions.reduce((s, t) => s + t.amount, 0);
  const cashTotal = dailyTransactions.filter(t => t.method === 'Nakit').reduce((s, t) => s + t.amount, 0);
  const cardTotal = dailyTransactions.filter(t => t.method === 'Kredi Kartı' || t.method === 'Bancontact').reduce((s, t) => s + t.amount, 0);

  document.getElementById('dailyTransCount').textContent = dailyTransactions.length;
  document.getElementById('dailyRevenue').textContent = `€${totalRevenue.toLocaleString('tr-TR')}`;
  document.getElementById('dailyCash').textContent = `€${Math.round(cashTotal)}`;
  document.getElementById('dailyCard').textContent = `€${Math.round(cardTotal)}`;
}

function printXZReport(type) {
  const isZ = type === 'Z';
  document.getElementById('reportModalTitle').textContent = isZ ? '🔒 Z Raporu — Gün Kapat' : '📊 X Raporu';
  document.getElementById('reportTypeHeader').textContent = isZ ? 'Z RAPORU — GÜN KAPATMA' : 'X RAPORU — GÜN İÇİ OKUMA';

  const totalRevenue = dailyTransactions.reduce((s, t) => s + t.amount, 0);
  const cashTotal = dailyTransactions.filter(t => t.method === 'Nakit').reduce((s, t) => s + t.amount, 0);
  const cardTotal = dailyTransactions.filter(t => t.method === 'Kredi Kartı').reduce((s, t) => s + t.amount, 0);
  const bcTotal = dailyTransactions.filter(t => t.method === 'Bancontact').reduce((s, t) => s + t.amount, 0);
  const puanTotal = dailyTransactions.filter(t => t.method === 'Puan').reduce((s, t) => s + t.amount, 0);

  document.getElementById('reportContent').innerHTML = `
    <div style="margin-bottom:12px;">
      <div class="receipt-line"><span>İşlem Sayısı</span><span>${dailyTransactions.length}</span></div>
      <div class="receipt-line"><span>Toplam Ciro</span><span>€${totalRevenue.toFixed(2)}</span></div>
    </div>
    <div style="border-top:1px dashed #ccc; padding-top:8px; margin-bottom:12px;">
      <div style="font-weight:700; margin-bottom:4px;">Ödeme Dağılımı</div>
      <div class="receipt-line"><span>💶 Nakit</span><span>€${cashTotal.toFixed(2)}</span></div>
      <div class="receipt-line"><span>💳 Kredi Kartı</span><span>€${cardTotal.toFixed(2)}</span></div>
      <div class="receipt-line"><span>📱 Bancontact</span><span>€${bcTotal.toFixed(2)}</span></div>
      <div class="receipt-line"><span>🔄 Puan</span><span>€${puanTotal.toFixed(2)}</span></div>
    </div>
    <div style="border-top:1px dashed #ccc; padding-top:8px; margin-bottom:12px;">
      <div style="font-weight:700; margin-bottom:4px;">KDV Özeti</div>
      <div class="receipt-line"><span>KDV %21 Matrah</span><span>€${(totalRevenue / 1.21).toFixed(2)}</span></div>
      <div class="receipt-line"><span>KDV Tutarı</span><span>€${(totalRevenue - totalRevenue / 1.21).toFixed(2)}</span></div>
    </div>
    <div style="border-top:2px dashed #ccc; padding-top:8px;">
      <div class="receipt-line receipt-total"><span>GENEL TOPLAM</span><span>€${totalRevenue.toFixed(2)}</span></div>
    </div>
    ${isZ ? `<div style="margin-top:16px; text-align:center; font-weight:700; color:#dc2626;">✓ GÜN KAPATILDI<br>Yeni gün başlatıldı</div>` : ''}
  `;

  openModal('reportModal');
  if (isZ) {
    showToast('Gün kapatıldı. Yeni güne geçildi.', 'success');
  }
}

// ===== MODAL UTILS =====
function openModal(id) {
  document.getElementById(id).classList.add('active');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

// Close on overlay click / ESC
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', (e) => {
    if(e.target === overlay) overlay.classList.remove('active');
  });
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape') document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active'));
});

// ===== TOAST =====
function showToast(message, type = 'success') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
  toast.innerHTML = `
    <span class="toast-icon">${icons[type] || 'ℹ️'}</span>
    <div class="toast-content">
      <div class="toast-message">${message}</div>
    </div>
    <span class="toast-close" onclick="this.parentElement.remove()">✕</span>
    <div class="toast-progress"></div>
  `;
  container.appendChild(toast);
  setTimeout(() => {
    toast.classList.add('exit');
    setTimeout(() => toast.remove(), 350);
  }, 4000);
}

// ===== SIDEBAR =====
function toggleMobileSidebar() {
  document.getElementById('sidebar').classList.toggle('mobile-open');
  document.getElementById('sidebarOverlay').classList.toggle('active');
}

// ===== NOTIFICATIONS =====
function showNotifications() {
  document.getElementById('notificationsPanel').classList.toggle('open');
}

// ===== THEME =====
function toggleTheme() {
  const html = document.documentElement;
  html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
}

// ===== INIT =====
document.addEventListener('DOMContentLoaded', () => {
  renderPosGrid('hizmetler');
  renderCart();
  renderDailyTable();
  onCustomerChange();

  // Set current time
  const now = new Date();
  document.getElementById('cartTime').textContent = now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
});
</script>

let currentLang = localStorage.getItem('barberpro_lang') || 'tr';
function switchLang(lang) {
  currentLang = lang;
  localStorage.setItem('barberpro_lang', lang);
  document.documentElement.lang = lang;
  applyTranslations();
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
}
function applyTranslations() {
  const dict = i18n[currentLang];
  if (!dict) return;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    const attr = el.dataset.i18nAttr;
    const val = dict[key];
    if (val === undefined) return;
    if (attr) { el.setAttribute(attr, val); }
    else if (el.tagName === 'TITLE') { el.textContent = val; }
    else { el.textContent = val; }
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.dataset.i18nPlaceholder;
    if (dict[key] !== undefined) el.placeholder = dict[key];
  });
}
if (!document.getElementById('lang-style')) {
  const st = document.createElement('style');
  st.id = 'lang-style';
  st.textContent = '.lang-btn.active{background:var(--teal-600)!important;color:white!important;}.lang-btn:hover{color:var(--text-primary)!important;}';
  document.head.appendChild(st);
}
switchLang(currentLang);
</script>

<!-- ===== FORM VALIDATION & MODAL GUARD ===== -->
<script>
function validateFormInputs(container) {
  const root = typeof container === 'string' ? document.getElementById(container) : container;
  if (!root) return true;
  const inputs = root.querySelectorAll('input, select, textarea');
  let valid = true;
  let firstError = null;
  const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  inputs.forEach(function(el) {
    const isRequired = el.hasAttribute('required') || el.dataset.required === 'true';
    const val = el.value ? el.value.trim() : '';
    if (isRequired && !val) {
      el.style.borderColor = 'var(--red-500, #ef4444)';
      valid = false;
      if (!firstError) firstError = el;
      return;
    }
    if (el.type === 'email' || el.dataset.validate === 'email') {
      if (val && !emailRe.test(val)) {
        el.style.borderColor = 'var(--red-500, #ef4444)';
        valid = false;
        if (!firstError) firstError = el;
        return;
      }
    }
    if (el.type === 'tel' || el.dataset.validate === 'phone') {
      const digits = val.replace(/\D/g, '');
      if (val && digits.length < 7) {
        el.style.borderColor = 'var(--red-500, #ef4444)';
        valid = false;
        if (!firstError) firstError = el;
        return;
      }
    }
    el.style.borderColor = '';
  });
  if (!valid && firstError) {
    firstError.focus();
    if (typeof showToast === 'function') {
      showToast('Lütfen zorunlu alanları doğru şekilde doldurun.', 'error');
    } else {
      alert('Lütfen zorunlu alanları doğru şekilde doldurun.');
    }
  }
  return valid;
}
function guardModals() {
  document.querySelectorAll('.modal-overlay').forEach(function(m) {
    if (!m.classList.contains('active')) {
      m.style.opacity = '0';
      m.style.visibility = 'hidden';
    }
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      document.querySelectorAll('.modal-overlay.active').forEach(function(m) {
        m.classList.remove('active');
        m.style.opacity = '0';
        m.style.visibility = 'hidden';
      });
    }
  });
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', guardModals);
} else {
  guardModals();
}

(function(){
  function checkBPAuth(){
    const token = localStorage.getItem('kobipro_auth_token');
    if(!token && !window.location.pathname.includes('login.html')){
      window.location.href = 'login.html?redirect=' + encodeURIComponent(window.location.pathname + window.location.search);
    }
  }
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', checkBPAuth);
  } else {
    checkBPAuth();
  }
})();
