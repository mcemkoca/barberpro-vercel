<style>
/* ── Purple Theme Overrides ── */
:root, [data-theme="dark"] {
  --teal-50: #f0fdfa; --teal-100: #ccfbf1; --teal-200: #c4b5fd; --teal-300: #c4b5fd;
  --teal-400: #a78bfa; --teal-500: #8b5cf6; --teal-600: #7c3aed; --teal-700: #6d28d9;
  --teal-800: #6d28d9; --teal-900: #6d28d9;
  --amber-500: #f59e0b; --amber-600: #d97706;
  --shadow-glow: rgba(139,92,246,0.25);
}
[data-theme="dark"] ::selection { background:var(--purple-700,#6d28d9); color:var(--purple-100,#ede9fe); }

/* Sidebar brand */
.sidebar-brand-icon {
  background:linear-gradient(135deg,var(--teal-500),var(--teal-700)) !important;
}
.sidebar-link.active {
  background:linear-gradient(135deg,var(--teal-500),var(--teal-600)) !important;
}

/* Stat icons override */
.stat-card .stat-icon { background:linear-gradient(135deg,rgba(139,92,246,0.15),rgba(167,139,250,0.1)) !important; color:var(--teal-400) !important; }

/* Quick actions */
.quick-action:hover { background:linear-gradient(135deg,var(--teal-500),var(--teal-600)) !important; }

/* Staff performance */
.staff-card { display:flex; align-items:center; gap:12px; padding:14px; background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius-lg); transition:all var(--duration-fast); }
.staff-card:hover { border-color:rgba(139,92,246,0.3); }
.staff-avatar { width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg,var(--teal-400),var(--teal-600)); display:flex; align-items:center; justify-content:center; color:white; font-weight:600; font-size:0.875rem; flex-shrink:0; }
.staff-info { flex:1; min-width:0; }
.staff-name { font-size:0.875rem; font-weight:600; color:var(--text-primary); }
.staff-role { font-size:0.75rem; color:var(--text-muted); }
.staff-stats { display:flex; gap:8px; }
.staff-stat { text-align:center; }
.staff-stat-value { font-size:0.75rem; font-weight:700; color:var(--teal-400); }
.staff-stat-label { font-size:0.65rem; color:var(--text-muted); }
.staff-bar { width:60px; height:4px; background:var(--bg-tertiary); border-radius:999px; overflow:hidden; margin-top:4px; }
.staff-bar-fill { height:100%; background:linear-gradient(90deg,var(--teal-500),var(--teal-400)); border-radius:999px; }

/* Status badges */
.badge-bekliyor { background:rgba(59,130,246,0.15); color:#3b82f6; }
.badge-islemde { background:rgba(139,92,246,0.15); color:var(--teal-400); }
.badge-tamamlandi { background:rgba(16,185,129,0.15); color:var(--success-500); }
.badge-iptal { background:rgba(244,63,94,0.15); color:var(--error-500); }

/* Chair/station column */
.station-cell { display:flex; align-items:center; gap:6px; font-size:0.8125rem; color:var(--text-secondary); }
.station-dot { width:8px; height:8px; border-radius:50%; }
.station-dot.aktif { background:var(--success-500); }
.station-dot.bosta { background:var(--text-muted); }

/* Today's schedule timeline feel */
.schedule-row { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border-color); transition:background var(--duration-fast); }
.schedule-row:hover { background:var(--bg-secondary); border-radius:var(--radius-md); padding-left:8px; padding-right:8px; margin:0 -8px; }
.schedule-time { font-size:0.8125rem; font-weight:700; color:var(--text-primary); width:48px; text-align:right; flex-shrink:0; }
.schedule-timeline { width:2px; height:36px; background:var(--border-color); border-radius:999px; position:relative; flex-shrink:0; }
.schedule-timeline::after { content:''; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:8px; height:8px; border-radius:50%; background:var(--teal-500); }
.schedule-content { flex:1; min-width:0; }
.schedule-customer { font-size:0.875rem; font-weight:600; color:var(--text-primary); }
.schedule-service { font-size:0.75rem; color:var(--text-muted); }
.schedule-staff { font-size:0.75rem; color:var(--text-secondary); }
.schedule-price { font-size:0.8125rem; font-weight:600; color:var(--teal-400); flex-shrink:0; text-align:right; min-width:48px; }

/* Loyalty tier badges */
.tier-badge { padding:2px 8px; border-radius:999px; font-size:0.6875rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; }
.tier-bronze { background:linear-gradient(135deg,#cd7f32,#b87333); color:white; }
.tier-silver { background:linear-gradient(135deg,#c0c0c0,#a8a8a8); color:#1e293b; }
.tier-gold { background:linear-gradient(135deg,#ffd700,#daa520); color:#1e293b; }
.tier-platinum { background:linear-gradient(135deg,#e5e4e2,#b0b0b0); color:#1e293b; }

/* Modal form extras */
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
@media (max-width:640px) { .form-row { grid-template-columns:1fr; } }

/* Revenue glow on stat cards */
.stat-revenue .stat-value { background:linear-gradient(135deg,var(--teal-400),var(--teal-500)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }



/* ── Mobile Responsive Overrides (Stages 5+7) ── */
@media (max-width:1024px) {
  .sidebar { transform:translateX(-100%); width:var(--sidebar-width); }
  .sidebar.mobile-open { transform:translateX(0); }
  .main { margin-left:0 !important; }
  .header-search { display:none; }
  .widget-grid-4 { grid-template-columns:repeat(2,1fr); }
  .widget-grid-3 { grid-template-columns:repeat(2,1fr); }
}

@media (max-width:768px) {
  .page { padding:var(--space-4) var(--space-3); }
  .page-header { flex-direction:column; gap:var(--space-3); }
  .page-actions { width:100%; }
  .page-actions .btn { flex:1; min-height:44px; font-size:var(--text-sm); }
  .header { padding:0 var(--space-3); }
  .header-title { font-size:var(--text-base); }
  .widget-grid-4, .widget-grid-3, .widget-grid-2 { grid-template-columns:1fr; }
  .chart-container { height:200px; }
  .quick-actions { gap:var(--space-2); }
  .quick-action { flex:1; min-width:0; justify-content:center; min-height:44px; }
  /* Tables: scroll wrapper */
  .data-table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .data-table { min-width:640px; }
  .notifications-panel { width:100%; max-width:380px; }
  /* Touch-friendly */
  .btn, .header-btn, .sidebar-link, .quick-action { min-height:44px; }
}

@media (max-width:375px) {
  body { font-size:14px; }
  .page { padding:var(--space-3) var(--space-2); }
  .page-title { font-size:var(--text-xl); }
  .btn { padding:10px 12px; font-size:14px; min-height:44px; }
  .header-btn { width:40px; height:40px; }
  .card { padding:var(--space-4); }
  .stat-value { font-size:var(--text-xl); }
  .chart-container { height:180px; }
  .sidebar-brand-icon { width:48px; height:48px; background:linear-gradient(135deg,var(--teal-500),var(--teal-700)); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:700; color:white; flex-shrink:0; box-shadow:0 2px 8px var(--teal-glow); }
  .quick-action { font-size:13px; padding:var(--space-2) var(--space-3); }
}

/* Card view tables on very small screens */
@media (max-width:640px) {
  .data-table tbody tr {
    display:flex; flex-direction:column; padding:var(--space-3);
    border-bottom:1px solid var(--border-color); gap:4px;
  }
  .data-table tbody td { padding:2px 0; white-space:normal; font-size:14px; }
  .data-table thead { display:none; }
  .data-table tbody td::before {
    content: attr(data-label); font-weight:600; color:var(--text-muted);
    font-size:12px; display:block; margin-bottom:2px;
  }
}

</head>

function openModal(id) {

// ===== TOAST =====
function showToast(message, type = 'success') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
  toast.innerHTML = `
    <span class="toast-icon">${icons[type] || 'ℹ️'}</span>
    <div class="toast-content">
      <div class="toast-message">${message}</div>
    </div>
    <span class="toast-close" onclick="this.parentElement.remove()">✕</span>
    <div class="toast-progress"></div>
  `;
  container.appendChild(toast);
  setTimeout(() => {
    toast.classList.add('exit');
    setTimeout(() => toast.remove(), 350);
  }, 4000);
}

let currentLang = localStorage.getItem('barberpro_lang') || 'tr';
function switchLang(lang) {
  currentLang = lang;
  localStorage.setItem('barberpro_lang', lang);
  document.documentElement.lang = lang;
  applyTranslations();
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
}
function applyTranslations() {
  const dict = i18n[currentLang];
  if (!dict) return;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    const attr = el.dataset.i18nAttr;
    const val = dict[key];
    if (val === undefined) return;
    if (attr) { el.setAttribute(attr, val); }
    else if (el.tagName === 'TITLE') { el.textContent = val; }
    else { el.textContent = val; }
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.dataset.i18nPlaceholder;
    if (dict[key] !== undefined) el.placeholder = dict[key];
  });
}
if (!document.getElementById('lang-style')) {
  const st = document.createElement('style');
  st.id = 'lang-style';
  st.textContent = '.lang-btn.active{background:var(--teal-600)!important;color:white!important;}.lang-btn:hover{color:var(--text-primary)!important;}';
  document.head.appendChild(st);
}
switchLang(currentLang);
</script>

<!-- ===== FORM VALIDATION & MODAL GUARD ===== -->
<script>
function validateFormInputs(container) {
  const root = typeof container === 'string' ? document.getElementById(container) : container;
  if (!root) return true;
  const inputs = root.querySelectorAll('input, select, textarea');
  let valid = true;
  let firstError = null;
  const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  inputs.forEach(function(el) {
    const isRequired = el.hasAttribute('required') || el.dataset.required === 'true';
    const val = el.value ? el.value.trim() : '';
    if (isRequired && !val) {
      el.style.borderColor = 'var(--red-500, #ef4444)';
      valid = false;
      if (!firstError) firstError = el;
      return;
    }
    if (el.type === 'email' || el.dataset.validate === 'email') {
      if (val && !emailRe.test(val)) {
        el.style.borderColor = 'var(--red-500, #ef4444)';
        valid = false;
        if (!firstError) firstError = el;
        return;
      }
    }
    if (el.type === 'tel' || el.dataset.validate === 'phone') {
      const digits = val.replace(/\D/g, '');
      if (val && digits.length < 7) {
        el.style.borderColor = 'var(--red-500, #ef4444)';
        valid = false;
        if (!firstError) firstError = el;
        return;
      }
    }
    el.style.borderColor = '';
  });
  if (!valid && firstError) {
    firstError.focus();
    if (typeof showToast === 'function') {
      showToast('Lütfen zorunlu alanları doğru şekilde doldurun.', 'error');
    } else {
      alert('Lütfen zorunlu alanları doğru şekilde doldurun.');
    }
  }
  return valid;
}
function guardModals() {
  document.querySelectorAll('.modal-overlay').forEach(function(m) {
    if (!m.classList.contains('active')) {
      m.style.opacity = '0';
      m.style.visibility = 'hidden';
    }
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      document.querySelectorAll('.modal-overlay.active').forEach(function(m) {
        m.classList.remove('active');
        m.style.opacity = '0';
        m.style.visibility = 'hidden';
      });
    }
  });
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', guardModals);
} else {
  guardModals();
}

/* ===== MODULE AUTH CHECK ===== */
function checkModuleAuth() {
  const token = localStorage.getItem('kobipro_auth_token');
  if (!token && !window.location.pathname.includes('login.html') && !window.location.pathname.includes('index.html')) {
    window.location.href = 'login.html?redirect=' + encodeURIComponent(window.location.pathname);
  }
}

// Module auth check on load
checkModuleAuth();

</script>
