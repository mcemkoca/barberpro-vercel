<!DOCTYPE html><html lang="tr" data-theme="dark"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#a855f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">

<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/dashboard.css">
<style>
/* ── Purple/Teal Theme Overrides ── */
:root,[data-theme="dark"]{--shadow-glow:rgba(139,92,246,0.25);}
[data-theme="dark"]::selection{background:var(--teal-700);color:var(--teal-100);}
.sidebar-brand-icon{background:linear-gradient(135deg,var(--teal-500),var(--teal-700))!important;}
.sidebar-link.active{background:linear-gradient(135deg,var(--teal-500),var(--teal-600))!important;}

/* ── Shift Page Specific Styles ── */
.shift-summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-4);margin-bottom:var(--space-6);}
@media(max-width:1024px){.shift-summary-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:480px){.shift-summary-grid{grid-template-columns:1fr;}}

/* ── Weekly Shift Calendar ── */
.shift-calendar-wrap{background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:var(--space-6);}
.shift-cal-header{display:flex;align-items:center;justify-content:space-between;padding:var(--space-4) var(--space-6);border-bottom:1px solid var(--border-color);flex-wrap:wrap;gap:var(--space-3);}
.shift-cal-title{font-size:var(--text-lg);font-weight:600;display:flex;align-items:center;gap:var(--space-2);}
.shift-cal-nav{display:flex;align-items:center;gap:var(--space-2);}
.shift-cal-nav-btn{width:32px;height:32px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;color:var(--text-muted);background:var(--bg-secondary);border:none;cursor:pointer;transition:all var(--duration-fast);}
.shift-cal-nav-btn:hover{color:#fff;background:linear-gradient(135deg,var(--teal-500),var(--teal-600));}
.shift-cal-week{font-weight:600;color:var(--text-primary);font-size:var(--text-sm);min-width:180px;text-align:center;}

/* Calendar Grid */
.shift-cal-grid{display:grid;grid-template-columns:200px repeat(7,1fr);gap:1px;background:var(--border-color);}
.shift-cal-grid-header{display:contents;}
.shift-cal-header-cell{background:var(--bg-secondary);padding:var(--space-3) var(--space-2);text-align:center;font-size:var(--text-xs);font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;}
.shift-cal-header-cell:first-child{text-align:left;padding-left:var(--space-4);}
.shift-cal-row{display:contents;}
.shift-cal-staff{background:var(--bg-card);padding:var(--space-3) var(--space-4);display:flex;align-items:center;gap:var(--space-3);font-size:var(--text-sm);font-weight:500;color:var(--text-primary);border-bottom:1px solid var(--border-color);}
.shift-cal-staff-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:var(--text-xs);font-weight:700;color:#fff;flex-shrink:0;}
.shift-cal-staff-info{min-width:0;}
.shift-cal-staff-name{font-weight:600;font-size:var(--text-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.shift-cal-staff-role{font-size:10px;color:var(--text-muted);margin-top:1px;}

.shift-cal-cell{background:var(--bg-card);padding:var(--space-2);min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;transition:all var(--duration-fast);position:relative;border-bottom:1px solid var(--border-color);}
.shift-cal-cell:hover{background:var(--bg-tertiary);transform:scale(1.02);z-index:2;box-shadow:var(--shadow-md);}
.shift-cal-cell.empty-slot{border:2px dashed var(--error-500);background:rgba(244,63,94,0.05);}
.shift-cal-cell.empty-slot::after{content:"—";color:var(--error-500);font-size:var(--text-lg);font-weight:300;}
.shift-cal-cell.leave{background:rgba(245,158,11,0.12);border-left:3px solid var(--amber-500);}
.shift-cal-cell.leave .shift-time{color:var(--amber-400);font-weight:600;}
.shift-cal-cell.leave .shift-label{color:var(--amber-500);font-size:10px;}
.shift-cal-cell.full-shift{background:linear-gradient(135deg,rgba(20,184,166,0.15),rgba(139,92,246,0.1));}
.shift-cal-cell.full-shift .shift-time{color:var(--teal-400);font-weight:600;}
.shift-cal-cell.half-shift{background:rgba(20,184,166,0.06);}
.shift-cal-cell.half-shift .shift-time{color:var(--teal-300);font-weight:500;}
.shift-cal-cell.short-shift{background:rgba(139,92,246,0.06);}
.shift-cal-cell.short-shift .shift-time{color:#a78bfa;font-weight:500;}
.shift-time{font-size:11px;}
.shift-hours{font-size:10px;color:var(--text-muted);}

/* ── Leave Requests Panel ── */
.leave-panel{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4);margin-bottom:var(--space-6);}
@media(max-width:1024px){.leave-panel{grid-template-columns:1fr;}}
.leave-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-lg);padding:var(--space-5);}
.leave-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-4);}
.leave-card-title{font-size:var(--text-base);font-weight:600;}
.leave-list{display:flex;flex-direction:column;gap:var(--space-3);}
.leave-item{display:flex;align-items:flex-start;gap:var(--space-3);padding:var(--space-3);background:var(--bg-secondary);border-radius:var(--radius-md);border:1px solid transparent;transition:all var(--duration-fast);cursor:pointer;}
.leave-item:hover{border-color:var(--slate-300);}
.leave-item.expanded{background:var(--bg-tertiary);}
.leave-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:var(--text-xs);font-weight:700;color:#fff;flex-shrink:0;}
.leave-content{flex:1;min-width:0;}
.leave-top{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);}
.leave-name{font-size:var(--text-sm);font-weight:600;color:var(--text-primary);}
.leave-dates{font-size:var(--text-xs);color:var(--text-muted);margin-top:2px;}
.leave-type{font-size:var(--text-xs);padding:2px 8px;border-radius:9999px;font-weight:600;}
.leave-type-yillik{background:rgba(59,130,246,0.15);color:#3b82f6;}
.leave-type-hastalik{background:rgba(244,63,94,0.15);color:var(--error-500);}
.leave-type-kisisel{background:rgba(139,92,246,0.15);color:#a78bfa;}
.leave-type-egitim{background:rgba(16,185,129,0.15);color:var(--success-500);}
.leave-actions{display:flex;gap:var(--space-2);margin-top:var(--space-2);}
.leave-btn{padding:4px 12px;border-radius:var(--radius-sm);font-size:var(--text-xs);font-weight:600;border:none;cursor:pointer;transition:all var(--duration-fast);}
.leave-btn-approve{background:var(--success-500);color:#fff;}
.leave-btn-approve:hover{background:#059669;}
.leave-btn-reject{background:var(--error-500);color:#fff;}
.leave-btn-reject:hover{background:#e11d48;}
.leave-detail{padding:var(--space-3);margin-top:var(--space-2);background:var(--bg-card);border-radius:var(--radius-md);font-size:var(--text-xs);color:var(--text-secondary);border:1px solid var(--border-color);display:none;}
.leave-item.expanded .leave-detail{display:block;}
.leave-detail-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border-color);}
.leave-detail-row:last-child{border-bottom:none;}

/* ── Weekly Hours Summary ── */
.hours-table-wrap{background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:var(--space-6);}
.hours-table{width:100%;border-collapse:collapse;font-size:var(--text-sm);}
.hours-table thead th{background:var(--bg-secondary);padding:var(--space-3) var(--space-4);text-align:left;font-weight:600;font-size:var(--text-xs);text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);white-space:nowrap;position:sticky;top:0;z-index:5;cursor:pointer;user-select:none;}
.hours-table thead th::after{content:'⇅';margin-left:6px;opacity:0.4;font-size:10px;}
.hours-table thead th.asc::after{content:'↑';opacity:1;}
.hours-table thead th.desc::after{content:'↓';opacity:1;}
.hours-table tbody tr{border-bottom:1px solid var(--border-color);transition:background var(--duration-fast);}
.hours-table tbody tr:last-child{border-bottom:none;}
.hours-table tbody tr:hover{background:var(--bg-secondary);}
.hours-table tbody td{padding:var(--space-3) var(--space-4);color:var(--text-primary);vertical-align:middle;}
.hours-table .cell-name{display:flex;align-items:center;gap:var(--space-3);}
.hours-table .cell-name-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0;}
.hours-over{color:var(--success-500);font-weight:600;}
.hours-under{color:var(--error-500);font-weight:600;}
.hours-ok{color:var(--text-secondary);}

/* ── Capacity Alerts ── */
.capacity-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-4);margin-bottom:var(--space-6);}
@media(max-width:1024px){.capacity-grid{grid-template-columns:1fr;}}
.capacity-card{padding:var(--space-4);border-radius:var(--radius-lg);border:1px solid var(--border-color);background:var(--bg-card);display:flex;align-items:flex-start;gap:var(--space-3);transition:all var(--duration-fast);}
.capacity-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.capacity-icon{width:40px;height:40px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:var(--text-lg);flex-shrink:0;}
.capacity-card.warning .capacity-icon{background:rgba(249,115,22,0.15);color:var(--warning-500);}
.capacity-card.success .capacity-icon{background:rgba(16,185,129,0.15);color:var(--success-500);}
.capacity-card.info .capacity-icon{background:rgba(59,130,246,0.15);color:var(--info-500);}
.capacity-content{flex:1;}
.capacity-title{font-size:var(--text-sm);font-weight:600;color:var(--text-primary);margin-bottom:2px;}
.capacity-desc{font-size:var(--text-xs);color:var(--text-muted);line-height:1.4;}

/* ── Modals ── */
.modal-overlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:var(--space-4);opacity:0;visibility:hidden;transition:opacity var(--duration-normal),visibility var(--duration-normal);}
.modal-overlay.active{opacity:1;visibility:visible;}
.modal{background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-xl);width:100%;max-width:560px;max-height:90vh;overflow:auto;transform:scale(0.95) translateY(20px);opacity:0;transition:transform var(--duration-slow) var(--ease-spring),opacity var(--duration-slow);box-shadow:var(--shadow-xl);}
.modal-overlay.active .modal{transform:scale(1) translateY(0);opacity:1;}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:var(--space-5) var(--space-6);border-bottom:1px solid var(--border-color);position:sticky;top:0;background:var(--bg-card);z-index:5;}
.modal-title{font-size:var(--text-lg);font-weight:600;}
.modal-close{width:32px;height:32px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;color:var(--text-muted);transition:all var(--duration-fast);background:var(--bg-secondary);border:none;cursor:pointer;}
.modal-close:hover{background:var(--error-100);color:var(--error-500);}
.modal-body{padding:var(--space-6);}
.modal-footer{display:flex;align-items:center;justify-content:flex-end;gap:var(--space-3);padding:var(--space-4) var(--space-6);border-top:1px solid var(--border-color);background:var(--bg-secondary);border-radius:0 0 var(--radius-xl) var(--radius-xl);}

/* Multi-select staff list */
.staff-multi-list{display:flex;flex-direction:column;gap:var(--space-2);max-height:240px;overflow-y:auto;padding:var(--space-2);background:var(--bg-secondary);border-radius:var(--radius-md);}
.staff-multi-item{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);cursor:pointer;transition:all var(--duration-fast);border:1.5px solid transparent;}
.staff-multi-item:hover{background:var(--bg-tertiary);}
.staff-multi-item.selected{border-color:var(--teal-500);background:rgba(139,92,246,0.08);}
.staff-multi-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0;}

/* Template pills */
.template-pills{display:flex;gap:var(--space-2);flex-wrap:wrap;}
.template-pill{padding:8px 14px;border-radius:var(--radius-md);font-size:var(--text-sm);font-weight:500;cursor:pointer;transition:all var(--duration-fast);border:1.5px solid var(--border-color);background:var(--bg-card);color:var(--text-secondary);}
.template-pill:hover{border-color:var(--teal-500);color:var(--text-primary);}
.template-pill.active{background:linear-gradient(135deg,var(--teal-500),var(--teal-600));color:#fff;border-color:transparent;}

/* Role badges inline */
.role-badge-inline{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:9999px;font-size:10px;font-weight:600;}
.role-badge-usta{background:rgba(139,92,246,0.15);color:#a78bfa;}
.role-badge-colorist{background:rgba(236,72,153,0.15);color:#ec4899;}
.role-badge-kuafor{background:rgba(59,130,246,0.15);color:#3b82f6;}
.role-badge-manikurcu{background:rgba(245,158,11,0.15);color:#f59e0b;}
.role-badge-kasiyer{background:rgba(239,68,68,0.15);color:#ef4444;}
.role-badge-asistan{background:rgba(16,185,129,0.15);color:#10b981;}

/* Quick actions bar */
.quick-actions-bar{display:flex;gap:var(--space-3);flex-wrap:wrap;padding:var(--space-4);background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-lg);margin-bottom:var(--space-6);}
.quick-action-btn{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-4);background:var(--bg-secondary);border-radius:var(--radius-md);font-size:var(--text-sm);font-weight:500;color:var(--text-primary);transition:all var(--duration-fast);cursor:pointer;border:1px solid transparent;}
.quick-action-btn:hover{background:linear-gradient(135deg,var(--teal-500),var(--teal-600));color:#fff;transform:translateY(-2px);box-shadow:var(--shadow-glow-sm);}

/* Toast */
.toast-container{position:fixed;top:var(--space-6);right:var(--space-6);z-index:2000;display:flex;flex-direction:column;gap:var(--space-3);pointer-events:none;max-width:400px;}
.toast{pointer-events:all;background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-lg);padding:var(--space-4);display:flex;align-items:flex-start;gap:var(--space-3);box-shadow:var(--shadow-lg);animation:toastIn var(--duration-normal) var(--ease-out) forwards;position:relative;overflow:hidden;}
.toast-success{border-color:var(--success-500);}
.toast-error{border-color:var(--error-500);}
.toast-warning{border-color:var(--warning-500);}
@keyframes toastIn{from{opacity:0;transform:translateY(-20px) scale(0.96);}to{opacity:1;transform:translateY(0) scale(1);}}
.toast-title{font-weight:600;font-size:var(--text-sm);}
.toast-message{font-size:var(--text-sm);color:var(--text-secondary);margin-top:2px;}

/* Responsive */
@media(max-width:1024px){
.shift-cal-grid{grid-template-columns:160px repeat(7,1fr);}
.shift-cal-staff{padding:var(--space-2) var(--space-2);}
}
@media(max-width:768px){
.shift-cal-grid{grid-template-columns:120px repeat(7,1fr);font-size:10px;}
.shift-cal-staff-name{font-size:10px;}
.shift-cal-cell{min-height:56px;padding:var(--space-1);}
.shift-time{font-size:9px;}
}

[data-theme="dark"] ::selection { background:var(--purple-700,#6d28d9); color:var(--purple-100,#ede9fe); }


/* ── Mobile Responsive Overrides (Stages 5+7) ── */
@media (max-width:1024px) {
  .sidebar { transform:translateX(-100%); width:var(--sidebar-width); }
  .sidebar.mobile-open { transform:translateX(0); }
  .main { margin-left:0 !important; }
  .header-search { display:none; }
  .widget-grid-4 { grid-template-columns:repeat(2,1fr); }
  .widget-grid-3 { grid-template-columns:repeat(2,1fr); }
}

@media (max-width:768px) {
  .page { padding:var(--space-4) var(--space-3); }
  .page-header { flex-direction:column; gap:var(--space-3); }
  .page-actions { width:100%; }
  .page-actions .btn { flex:1; min-height:44px; font-size:var(--text-sm); }
  .header { padding:0 var(--space-3); }
  .header-title { font-size:var(--text-base); }
  .widget-grid-4, .widget-grid-3, .widget-grid-2 { grid-template-columns:1fr; }
  .chart-container { height:200px; }
  .quick-actions { gap:var(--space-2); }
  .quick-action { flex:1; min-width:0; justify-content:center; min-height:44px; }
  /* Tables: scroll wrapper */
  .data-table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .data-table { min-width:640px; }
  .notifications-panel { width:100%; max-width:380px; }
  /* Touch-friendly */
  .btn, .header-btn, .sidebar-link, .quick-action { min-height:44px; }
}

@media (max-width:375px) {
  body { font-size:14px; }
  .page { padding:var(--space-3) var(--space-2); }
  .page-title { font-size:var(--text-xl); }
  .btn { padding:10px 12px; font-size:14px; min-height:44px; }
  .header-btn { width:40px; height:40px; }
  .card { padding:var(--space-4); }
  .stat-value { font-size:var(--text-xl); }
  .chart-container { height:180px; }
  .sidebar-brand-icon { width:48px; height:48px; background:linear-gradient(135deg,var(--teal-500),var(--teal-700)); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:700; color:white; flex-shrink:0; box-shadow:0 2px 8px var(--teal-glow); }
  .quick-action { font-size:13px; padding:var(--space-2) var(--space-3); }
}

/* Card view tables on very small screens */
@media (max-width:640px) {
  .data-table tbody tr {
    display:flex; flex-direction:column; padding:var(--space-3);
    border-bottom:1px solid var(--border-color); gap:4px;
  }
  .data-table tbody td { padding:2px 0; white-space:normal; font-size:14px; }
  .data-table thead { display:none; }
  .data-table tbody td::before {
    content: attr(data-label); font-weight:600; color:var(--text-muted);
    font-size:12px; display:block; margin-bottom:2px;
  }
}

</head>

// ── Render Calendar ──
function renderCalendar(){
  const grid = document.getElementById('shiftCalendarGrid');
  let html = '<div class="shift-cal-grid-header">';
  html += '<div class="shift-cal-header-cell">Personel</div>';
  days.forEach((d,i)=>{
    const date = 19 + i;
    const isWeekend = i >= 5;
    html += `<div class="shift-cal-header-cell" style="${isWeekend?'color:var(--amber-400);':''}">${d}<br><span style="font-weight:400;font-size:10px;">${date} May</span></div>`;
  });
  html += '</div>';

  staffList.forEach(s=>{
    const shifts = shiftData[s.id];
    html += '<div class="shift-cal-row">';
    html += `<div class="shift-cal-staff">`;
    html += `<div class="shift-cal-staff-avatar" style="background:${s.color};">${s.initials}</div>`;
    html += `<div class="shift-cal-staff-info">`;
    html += `<div class="shift-cal-staff-name">${s.name}</div>`;
    html += `<span class="role-badge-inline role-badge-${s.role.toLowerCase().replace(/\s/g,'')}">${s.role}</span>`;
    html += `</div></div>`;

    shifts.forEach((shift,di)=>{
      const isSunday = di === 6;
      const cellClass = isSunday ? 'leave' : shift.type;
      const clickable = !isSunday;
      const onclick = clickable ? `onclick="cycleShift(${s.id},${di})" ondblclick="openEditModal(${s.id},${di})"` : '';
      let content = '';
      if(isSunday){
        content = '<span class="shift-time">İZİN</span><span class="shift-label">Kapalı</span>';
      } else if(shift.type === 'empty-slot'){
        content = '';
      } else if(shift.type === 'leave'){
        content = '<span class="shift-time">İZİN</span>';
      } else {
        content = `<span class="shift-time">${shift.label}</span>`;
        if(shift.hours > 0) content += `<span class="shift-hours">${shift.hours} saat</span>`;
      }
      html += `<div class="shift-cal-cell ${cellClass}" ${onclick} title="${s.name} — ${fullDays[di]}${shift.label?': '+shift.label:''}">${content}</div>`;
    });
    html += '</div>';
  });
  grid.innerHTML = html;
}

// ── Render Leave Requests ──
function renderLeaveRequests(){
  const list = document.getElementById('leaveList');
  let html = '';
  leaveRequests.forEach(req=>{
    const statusBadge = req.status==='pending'?'badge-warning':req.status==='approved'?'badge-success':'badge-error';
    const statusText = req.status==='pending'?'Onay Bekliyor':req.status==='approved'?'Onaylandı':'Reddedildi';
    const isPending = req.status==='pending';
    html += `<div class="leave-item${isPending?'':' expanded'}" id="leaveItem${req.id}">`;
    html += `<div class="leave-avatar" style="background:${req.color};">${req.initials}</div>`;
    html += `<div class="leave-content">`;
    html += `<div class="leave-top">`;
    html += `<div><div class="leave-name">${req.name}</div><div class="leave-dates">${req.start}${req.start!==req.end?' — '+req.end:''}</div></div>`;
    html += `<span class="leave-type leave-type-${req.type}">${req.typeLabel}</span>`;
    html += `</div>`;
    html += `<div style="display:flex;align-items:center;justify-content:space-between;margin-top:4px;">`;
    html += `<span class="badge ${statusBadge}">${statusText}</span>`;
    if(isPending){
      html += `<div class="leave-actions">`;
      html += `<button class="leave-btn leave-btn-approve" onclick="approveLeave(${req.id})">Onayla</button>`;
      html += `<button class="leave-btn leave-btn-reject" onclick="rejectLeave(${req.id})">Reddet</button>`;
      html += `</div>`;
    }
    html += `</div>`;
    html += `<div class="leave-detail">`;
    html += `<div class="leave-detail-row"><span>Notlar</span><span>${req.notes}</span></div>`;
    html += `<div class="leave-detail-row"><span>Yerine Bakacak</span><span style="color:var(--teal-400);font-weight:600;">${req.replacement}</span></div>`;
    html += `</div>`;
    html += `</div></div>`;
  });
  list.innerHTML = html;
}

// ── Render Hours Table ──
let hoursSort = {col:'name',dir:'asc'};
function renderHoursTable(){
  const tbody = document.getElementById('hoursTableBody');
  let data = [...hoursSummary];
  data.sort((a,b)=>{
    let av,bv;
    if(hoursSort.col==='name'){av=a.name;bv=b.name;}
    else if(hoursSort.col==='planned'){av=a.planned;bv=b.planned;}
    else if(hoursSort.col==='actual'){av=a.actual;bv=b.actual;}
    else if(hoursSort.col==='diff'){av=a.diff;bv=b.diff;}
    else if(hoursSort.col==='overtime'){av=a.overtime;bv=b.overtime;}
    else if(hoursSort.col==='leave'){av=a.leave;bv=b.leave;}
    if(av<bv)return hoursSort.dir==='asc'?-1:1;
    if(av>bv)return hoursSort.dir==='asc'?1:-1;
    return 0;
  });
  let html = '';
  data.forEach(h=>{
    const diffClass = h.diff>0?'hours-over':h.diff<0?'hours-under':'hours-ok';
    const diffSign = h.diff>0?'+':'';
    html += `<tr>`;
    html += `<td><div class="cell-name"><div class="cell-name-avatar" style="background:${h.color};">${h.initials}</div><span>${h.name}</span></div></td>`;
    html += `<td>${h.planned}</td>`;
    html += `<td>${h.actual}</td>`;
    html += `<td class="${diffClass}">${diffSign}${h.diff}</td>`;
    html += `<td>${h.overtime>0?'<span class="hours-over">+'+h.overtime+'</span>':'—'}</td>`;
    html += `<td>${h.leave}</td>`;
    html += `</tr>`;
  });
  tbody.innerHTML = html;

  document.querySelectorAll('#hoursTable thead th').forEach(th=>{
    th.classList.remove('asc','desc');
    if(th.getAttribute('onclick')&&th.getAttribute('onclick').includes(hoursSort.col)){
      th.classList.add(hoursSort.dir);
    }
  });
}
function sortHours(col){
  if(hoursSort.col===col) hoursSort.dir = hoursSort.dir==='asc'?'desc':'asc';
  else{hoursSort.col=col;hoursSort.dir='asc';}
  renderHoursTable();
}

function cycleShift(staffId,dayIndex){
  const current = shiftData[staffId][dayIndex];
  const presetLabels = shiftPresets.map(p=>p.label);
  const currentIdx = presetLabels.indexOf(current.label);
  const nextIdx = (currentIdx + 1) % shiftPresets.length;
  shiftData[staffId][dayIndex] = {...shiftPresets[nextIdx]};
  renderCalendar();
  showToast('Hızlı güncelleme: '+shiftPresets[nextIdx].label,'info');
}

// ── Modal Functions ──
function openModal(id){document.getElementById(id).classList.add('active');if(id==='createShiftModal')renderCreateStaffList();}
function closeModal(id){document.getElementById(id).classList.remove('active');}
function openEditModal(staffId,dayIndex){
  currentEdit = {staffId,dayIndex};
  const s = staffList.find(x=>x.id===staffId);
  const shift = shiftData[staffId][dayIndex];
  document.getElementById('editModalTitle').textContent = 'Vardiya Düzenle';
  document.getElementById('editModalStaffName').textContent = s.name;
  document.getElementById('editModalDate').textContent = fullDays[dayIndex] + ', ' + (19+dayIndex) + ' Mayıs 2026';
  document.getElementById('editStartTime').value = shift.start || '09:00';
  document.getElementById('editEndTime').value = shift.end || '17:00';
  document.getElementById('editBreakDuration').value = shift.hours>=8?'60':'30';
  document.getElementById('editShiftStatus').value = shift.type==='full-shift'?'full':shift.type==='half-shift'?'half':shift.type==='leave'?'leave':'empty';
  document.getElementById('editShiftNotes').value = '';
  openModal('editShiftModal');
}
function saveShiftEdit(){
  const status = document.getElementById('editShiftStatus').value;
  const start = document.getElementById('editStartTime').value;
  const end = document.getElementById('editEndTime').value;
  let newShift;
  if(status==='leave'){newShift={label:'İZİN',start:'',end:'',hours:0,type:'leave'};}
  else if(status==='empty'){newShift={label:'—',start:'',end:'',hours:0,type:'empty-slot'};}
  else{
    const sH=parseInt(start.split(':')[0]),sM=parseInt(start.split(':')[1]);
    const eH=parseInt(end.split(':')[0]),eM=parseInt(end.split(':')[1]);
    const hours = Math.round(((eH*60+eM)-(sH*60+sM))/60*10)/10;
    const label = start+'-'+end;
    const type = hours>=6?'full-shift':'half-shift';
    newShift={label,start,end,hours,type};
  }
  shiftData[currentEdit.staffId][currentEdit.dayIndex] = newShift;
  renderCalendar();
  closeModal('editShiftModal');
  showToast('Vardiya güncellendi','success');
}

// ── Template Selection ──
function selectTemplate(el){
  document.querySelectorAll('#templatePills .template-pill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  selectedTemplate = el.dataset.template;
}
function toggleStaffSelection(id){
  const el = document.getElementById('staffMulti'+id);
  if(selectedStaffForCreate.has(id)){selectedStaffForCreate.delete(id);el.classList.remove('selected');el.querySelector('span:last-child').style.opacity='0';}
  else{selectedStaffForCreate.add(id);el.classList.add('selected');el.querySelector('span:last-child').style.opacity='1';}
}
function applyShiftTemplate(){
  const autoWeekend = document.getElementById('autoWeekend').checked;
  selectedStaffForCreate.forEach(sid=>{
    for(let d=0;d<7;d++){
      let t = templates[selectedTemplate];
      if(autoWeekend){
        if(d===5) t = templates.full;
        if(d===6) t = templates.closed;
      }
      shiftData[sid][d] = {...t};
    }
  });
  renderCalendar();
  closeModal('createShiftModal');
  showToast('Vardiya şablonu uygulandı ('+selectedStaffForCreate.size+' personel)','success');
}

// ── Leave Actions ──
function approveLeave(id){
  const req = leaveRequests.find(r=>r.id===id);
  if(req){req.status='approved';renderLeaveRequests();showToast(req.name+' izni onaylandı','success');}
}
function rejectLeave(id){
  const req = leaveRequests.find(r=>r.id===id);
  if(req){req.status='rejected';renderLeaveRequests();showToast(req.name+' izni reddedildi','error');}
}

// ── Toast ──
function showToast(msg,type='info'){
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast toast-'+type;
  const icon = type==='success'?'✅':type==='error'?'❌':type==='warning'?'⚠️':'ℹ️';
  toast.innerHTML = `<div style="font-size:var(--text-lg);">${icon}</div><div class="toast-content"><div class="toast-title">${type==='success'?'Başarılı':type==='error'?'Hata':type==='warning'?'Uyarı':'Bilgi'}</div><div class="toast-message">${msg}</div></div>`;
  container.appendChild(toast);
  setTimeout(()=>{toast.remove();},3500);
}

// ── Navigation ──
function changeWeek(dir){
  showToast(dir>0?'Sonraki hafta':'Önceki hafta','info');
}
function resetWeek(){showToast('Bugünün haftasına dönüldü','info');}
function scrollToSection(id){document.getElementById(id).scrollIntoView({behavior:'smooth',block:'start'});}
function exportShifts(){showToast('Vardiya planı PDF olarak dışa aktarıldı','success');}
function autoFillWeekend(){
  staffList.forEach(s=>{
    shiftData[s.id][5] = {...templates.full};
    shiftData[s.id][6] = {...templates.closed};
  });
  renderCalendar();
  showToast('Hafta sonu otomatik dolduruldu','success');
}

// ── Sidebar / Theme ──
function toggleSidebar(){
  const sb=document.getElementById('sidebar'),ov=document.getElementById('sidebarOverlay');
  sb.classList.toggle('mobile-open');ov.classList.toggle('active');
}
function toggleMobileSidebar(){toggleSidebar();}
function toggleTheme(){
  const h=document.documentElement,t=h.getAttribute('data-theme');
  h.setAttribute('data-theme',t==='dark'?'light':'dark');
}
function showNotifications(){showToast('3 yeni bildirim var','info');}

// ── Init ──
document.addEventListener('DOMContentLoaded',()=>{
  renderCalendar();
  renderLeaveRequests();
  renderHoursTable();
});

// Close modals on overlay click
document.querySelectorAll('.modal-overlay').forEach(ov=>{
  ov.addEventListener('click',e=>{if(e.target===ov)ov.classList.remove('active');});
});
</script>

let currentLang = localStorage.getItem('barberpro_lang') || 'tr';
function switchLang(lang) {
  currentLang = lang;
  localStorage.setItem('barberpro_lang', lang);
  document.documentElement.lang = lang;
  applyTranslations();
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
}
function applyTranslations() {
  const dict = i18n[currentLang];
  if (!dict) return;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    const attr = el.dataset.i18nAttr;
    const val = dict[key];
    if (val === undefined) return;
    if (attr) { el.setAttribute(attr, val); }
    else if (el.tagName === 'TITLE') { el.textContent = val; }
    else { el.textContent = val; }
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.dataset.i18nPlaceholder;
    if (dict[key] !== undefined) el.placeholder = dict[key];
  });
}
if (!document.getElementById('lang-style')) {
  const st = document.createElement('style');
  st.id = 'lang-style';
  st.textContent = '.lang-btn.active{background:var(--teal-600)!important;color:white!important;}.lang-btn:hover{color:var(--text-primary)!important;}';
  document.head.appendChild(st);
}
switchLang(currentLang);
</script>

<!-- ===== FORM VALIDATION & MODAL GUARD ===== -->
<script>
function validateFormInputs(container) {
  const root = typeof container === 'string' ? document.getElementById(container) : container;
  if (!root) return true;
  const inputs = root.querySelectorAll('input, select, textarea');
  let valid = true;
  let firstError = null;
  const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  inputs.forEach(function(el) {
    const isRequired = el.hasAttribute('required') || el.dataset.required === 'true';
    const val = el.value ? el.value.trim() : '';
    if (isRequired && !val) {
      el.style.borderColor = 'var(--red-500, #ef4444)';
      valid = false;
      if (!firstError) firstError = el;
      return;
    }
    if (el.type === 'email' || el.dataset.validate === 'email') {
      if (val && !emailRe.test(val)) {
        el.style.borderColor = 'var(--red-500, #ef4444)';
        valid = false;
        if (!firstError) firstError = el;
        return;
      }
    }
    if (el.type === 'tel' || el.dataset.validate === 'phone') {
      const digits = val.replace(/\D/g, '');
      if (val && digits.length < 7) {
        el.style.borderColor = 'var(--red-500, #ef4444)';
        valid = false;
        if (!firstError) firstError = el;
        return;
      }
    }
    el.style.borderColor = '';
  });
  if (!valid && firstError) {
    firstError.focus();
    if (typeof showToast === 'function') {
      showToast('Lütfen zorunlu alanları doğru şekilde doldurun.', 'error');
    } else {
      alert('Lütfen zorunlu alanları doğru şekilde doldurun.');
    }
  }
  return valid;
}
function guardModals() {
  document.querySelectorAll('.modal-overlay').forEach(function(m) {
    if (!m.classList.contains('active')) {
      m.style.opacity = '0';
      m.style.visibility = 'hidden';
    }
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      document.querySelectorAll('.modal-overlay.active').forEach(function(m) {
        m.classList.remove('active');
        m.style.opacity = '0';
        m.style.visibility = 'hidden';
      });
    }
  });
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', guardModals);
} else {
  guardModals();
}

      window.location.href = 'login.html?redirect=' + encodeURIComponent(window.location.pathname + window.location.search);

  }
  if(document.readyState === 'loading'){
