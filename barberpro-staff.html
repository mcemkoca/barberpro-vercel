<style>
/* Staff specific styles */
.staff-card { display:flex; align-items:center; gap:var(--space-4); padding:var(--space-4); border-radius:var(--radius-lg); border:1.5px solid var(--border-color); background:var(--bg-card); transition:all var(--duration-normal); }
.staff-card:hover { border-color:#8b5cf6; transform:translateY(-2px); box-shadow:var(--shadow-md); }
.staff-card .staff-avatar { width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:var(--text-xl); font-weight:700; color:#fff; flex-shrink:0; }
.staff-card .staff-info { flex:1; min-width:0; }
.staff-card .staff-name { font-weight:600; font-size:var(--text-base); color:var(--text-primary); }
.staff-card .staff-role { font-size:var(--text-xs); color:var(--text-muted); margin-top:2px; }
.staff-card .staff-meta { display:flex; gap:var(--space-3); margin-top:var(--space-2); flex-wrap:wrap; }
.staff-card .staff-meta-item { font-size:var(--text-xs); color:var(--text-secondary); display:flex; align-items:center; gap:4px; }
.staff-card .staff-stats { display:flex; gap:var(--space-4); text-align:center; }
.staff-card .staff-stat { display:flex; flex-direction:column; }
.staff-card .staff-stat-val { font-weight:700; font-size:var(--text-lg); color:var(--violet-400); }
.staff-card .staff-stat-label { font-size:var(--text-xs); color:var(--text-muted); }
/* Role badges */
.role-badge { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:9999px; font-size:var(--text-xs); font-weight:600; }
.role-usta { background:rgba(139,92,246,0.15); color:#a78bfa; }
.role-kuafor { background:rgba(59,130,246,0.15); color:#3b82f6; }
.role-colorist { background:rgba(236,72,153,0.15); color:#ec4899; }
.role-manikurcu { background:rgba(245,158,11,0.15); color:#f59e0b; }
.role-asistan { background:rgba(16,185,129,0.15); color:#10b981; }
.role-stajyer { background:rgba(100,116,139,0.15); color:#94a3b8; }
.role-kasiyer { background:rgba(239,68,68,0.15); color:#ef4444; }
/* Schedule mini */
.schedule-mini { display:flex; gap:2px; margin-top:var(--space-2); }
.schedule-day { width:24px; height:24px; border-radius:var(--radius-sm); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:600; }
.schedule-day.on { background:linear-gradient(135deg,#8b5cf6,#7c3aed); color:#fff; }
.schedule-day.off { background:var(--bg-tertiary); color:var(--text-muted); }
/* Rating */
.rating-bar { display:flex; align-items:center; gap:6px; }
.rating-bar .stars { color:var(--amber-400); font-size:var(--text-sm); letter-spacing:1px; }
.rating-bar .score { font-size:var(--text-xs); font-weight:600; color:var(--text-muted); }
/* Commission bar */
.comm-row { display:flex; align-items:center; justify-content:space-between; padding:var(--space-3); background:var(--bg-secondary); border-radius:var(--radius-md); margin-bottom:var(--space-2); }
/* Schedule modal grid */
.schedule-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:var(--space-2); }
.schedule-cell { padding:var(--space-3); border:1.5px solid var(--border-color); border-radius:var(--radius-md); text-align:center; cursor:pointer; transition:all var(--duration-fast); }
.schedule-cell:hover { border-color:#8b5cf6; }
.schedule-cell.active { border-color:#8b5cf6; background:rgba(139,92,246,0.08); }
.schedule-cell .day-name { font-size:var(--text-xs); font-weight:600; color:var(--text-muted); text-transform:uppercase; }
.schedule-cell .hours { font-size:var(--text-sm); font-weight:600; color:var(--text-primary); margin-top:4px; }
/* Staff filter */
.role-filter { display:flex; gap:var(--space-2); flex-wrap:wrap; margin-bottom:var(--space-4); }
.role-pill { padding:6px 14px; border-radius:9999px; font-size:var(--text-sm); font-weight:500; cursor:pointer; transition:all var(--duration-fast); border:1.5px solid var(--border-color); background:var(--bg-card); color:var(--text-secondary); }
.role-pill:hover { border-color:#8b5cf6; color:var(--text-primary); }
.role-pill.active { background:linear-gradient(135deg,#8b5cf6,#7c3aed); color:#fff; border-color:transparent; }
/* Top performer badge */
.top-performer { position:absolute; top:-8px; right:-8px; background:linear-gradient(135deg,#fbbf24,#f59e0b); color:#fff; font-size:10px; font-weight:700; padding:3px 10px; border-radius:9999px; box-shadow:var(--shadow-sm); z-index:2; }
/* Work hours input */
.time-range { display:flex; align-items:center; gap:var(--space-2); }
.time-range input { width:100px; text-align:center; }
.time-range span { color:var(--text-muted); font-size:var(--text-sm); }
/* Status toggle in table */
.status-toggle-btn { width:36px; height:20px; border-radius:9999px; position:relative; cursor:pointer; transition:all var(--duration-normal); border:none; }
.status-toggle-btn.on { background:linear-gradient(135deg,#8b5cf6,#7c3aed); }
.status-toggle-btn.off { background:var(--bg-tertiary); }
.status-toggle-btn::after { content:''; position:absolute; width:16px; height:16px; border-radius:50%; background:#fff; top:2px; left:2px; transition:transform var(--duration-normal); }
.status-toggle-btn.on::after { transform:translateX(16px); }

[data-theme="dark"] ::selection { background:var(--purple-700,#6d28d9); color:var(--purple-100,#ede9fe); }


/* ── Mobile Responsive Overrides (Stages 5+7) ── */
@media (max-width:1024px) {
  .sidebar { transform:translateX(-100%); width:var(--sidebar-width); }
  .sidebar.mobile-open { transform:translateX(0); }
  .main { margin-left:0 !important; }
  .header-search { display:none; }
  .widget-grid-4 { grid-template-columns:repeat(2,1fr); }
  .widget-grid-3 { grid-template-columns:repeat(2,1fr); }
}

@media (max-width:768px) {
  .page { padding:var(--space-4) var(--space-3); }
  .page-header { flex-direction:column; gap:var(--space-3); }
  .page-actions { width:100%; }
  .page-actions .btn { flex:1; min-height:44px; font-size:var(--text-sm); }
  .header { padding:0 var(--space-3); }
  .header-title { font-size:var(--text-base); }
  .widget-grid-4, .widget-grid-3, .widget-grid-2 { grid-template-columns:1fr; }
  .chart-container { height:200px; }
  .quick-actions { gap:var(--space-2); }
  .quick-action { flex:1; min-width:0; justify-content:center; min-height:44px; }
  /* Tables: scroll wrapper */
  .data-table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .data-table { min-width:640px; }
  .notifications-panel { width:100%; max-width:380px; }
  /* Touch-friendly */
  .btn, .header-btn, .sidebar-link, .quick-action { min-height:44px; }
}

@media (max-width:375px) {
  body { font-size:14px; }
  .page { padding:var(--space-3) var(--space-2); }
  .page-title { font-size:var(--text-xl); }
  .btn { padding:10px 12px; font-size:14px; min-height:44px; }
  .header-btn { width:40px; height:40px; }
  .card { padding:var(--space-4); }
  .stat-value { font-size:var(--text-xl); }
  .chart-container { height:180px; }
  .sidebar-brand-icon { width:48px; height:48px; background:linear-gradient(135deg,var(--teal-500),var(--teal-700)); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:700; color:white; flex-shrink:0; box-shadow:0 2px 8px var(--teal-glow); }
  .quick-action { font-size:13px; padding:var(--space-2) var(--space-3); }
}

/* Card view tables on very small screens */
@media (max-width:640px) {
  .data-table tbody tr {
    display:flex; flex-direction:column; padding:var(--space-3);
    border-bottom:1px solid var(--border-color); gap:4px;
  }
  .data-table tbody td { padding:2px 0; white-space:normal; font-size:14px; }
  .data-table thead { display:none; }
  .data-table tbody td::before {
    content: attr(data-label); font-weight:600; color:var(--text-muted);
    font-size:12px; display:block; margin-bottom:2px;
  }
}

  document.querySelector('[data-role="'+role+'"]').classList.add('active');
  const rows = document.querySelectorAll('#staffTable tbody tr');
  rows.forEach(row=>{ row.style.display = (role==='all'||row.dataset.role===role)?'':'none'; });
}
function filterStaff(){
  const term = document.getElementById('staffSearch').value.toLowerCase();
  const rows = document.querySelectorAll('#staffTable tbody tr');
  rows.forEach(row=>{ row.style.display = row.textContent.toLowerCase().includes(term)?'':'none'; });
}
function sortStaff(by){
  showToast('info','Sıralama','Personel '+by+' göre sıralandı (demo)');
}
function toggleStaffStatus(btn){
  btn.classList.toggle('on'); btn.classList.toggle('off');
  showToast('info','Durum Değişti','Personel '+(btn.classList.contains('on')?'Aktif':'Pasif')+' yapıldı');
}
function toggleScheduleDay(el){
  el.classList.toggle('active');
  const hours = el.querySelector('.hours');
  hours.textContent = el.classList.contains('active')?'09-19':'Kapalı';
}
function openStaffSchedule(name){
  showToast('info','Takvim',name+' çalışma takvimi görüntüleniyor');
  openModal('scheduleModal');
}
function editStaff(name){
  showToast('info','Düzenleme',name+' düzenleme modunda (demo)');
  openModal('addStaffModal');
}
function deleteStaff(name){
  if(!confirm(name+' personel kaydını silmek istediğinize emin misiniz?')) return;
  showToast('warning','Personel Silindi',name+' silindi');
}
function saveStaff(){
  closeModal('addStaffModal');
  showToast('success','Personel Eklendi','Yeni personel eklendi');
}
function toggleTheme(){
  const html = document.documentElement;
  const current = html.getAttribute('data-theme')||'dark';
  html.setAttribute('data-theme', current==='dark'?'light':'dark');
}
function showNotifications(){ showToast('info','Bildirimler','1 yeni bildirim (demo)'); }
function showToast(type,title,message){
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className='toast toast-'+type;
  const icons={success:'✅',error:'❌',warning:'⚠️',info:'ℹ️'};
  toast.innerHTML='<div class="toast-icon">'+icons[type]+'</div><div class="toast-content"><div class="toast-title">'+title+'</div><div class="toast-message">'+message+'</div></div><button class="toast-close" onclick="this.parentElement.remove()">✕</button><div class="toast-progress"></div>';
  container.appendChild(toast);
  setTimeout(()=>{ toast.classList.add('exit'); setTimeout(()=>toast.remove(),400); },4000);
}
// Mobile overlay
const overlay = document.createElement('div'); overlay.className='sidebar-overlay'; overlay.onclick=()=>{ document.getElementById('sidebar').classList.remove('mobile-open'); overlay.classList.remove('active'); }; document.body.appendChild(overlay);
const origToggle = toggleSidebar;
toggleSidebar = function(){ document.getElementById('sidebar').classList.toggle('mobile-open'); overlay.classList.toggle('active'); };
</script>

  "div_stajyer": "Stajyer",
  "div_kasiyer": "Kasiyer",
  "div_hasan_korkmaz_2": "Hasan Korkmaz",
  "div_selin_öztürk_2": "Selin Öztürk",
  "div_mehmet_aydın_2": "Mehmet Maanddın"
}
};
let currentLang = localStorage.getItem('barberpro_lang') || 'tr';
function switchLang(lang) {
  currentLang = lang;
  localStorage.setItem('barberpro_lang', lang);
  document.documentElement.lang = lang;
  applyTranslations();
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
}
function applyTranslations() {
  const dict = i18n[currentLang];
  if (!dict) return;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    const attr = el.dataset.i18nAttr;
    const val = dict[key];
    if (val === undefined) return;
    if (attr) { el.setAttribute(attr, val); }
    else if (el.tagName === 'TITLE') { el.textContent = val; }
    else { el.textContent = val; }
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.dataset.i18nPlaceholder;
    if (dict[key] !== undefined) el.placeholder = dict[key];
  });
}
if (!document.getElementById('lang-style')) {
  const st = document.createElement('style');
  st.id = 'lang-style';
  st.textContent = '.lang-btn.active{background:var(--teal-600)!important;color:white!important;}.lang-btn:hover{color:var(--text-primary)!important;}';
  document.head.appendChild(st);
}
switchLang(currentLang);

<!-- ===== FORM VALIDATION & MODAL GUARD ===== -->
<script>
function validateFormInputs(container) {
  const root = typeof container === 'string' ? document.getElementById(container) : container;
  if (!root) return true;
  const inputs = root.querySelectorAll('input, select, textarea');
  let valid = true;
  let firstError = null;
  const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  inputs.forEach(function(el) {
    const isRequired = el.hasAttribute('required') || el.dataset.required === 'true';
    const val = el.value ? el.value.trim() : '';
    if (isRequired && !val) {
      el.style.borderColor = 'var(--red-500, #ef4444)';
      valid = false;
      if (!firstError) firstError = el;
      return;
    }
    if (el.type === 'email' || el.dataset.validate === 'email') {
      if (val && !emailRe.test(val)) {
        el.style.borderColor = 'var(--red-500, #ef4444)';
        valid = false;
        if (!firstError) firstError = el;
        return;
      }
    }
    if (el.type === 'tel' || el.dataset.validate === 'phone') {
      const digits = val.replace(/\D/g, '');
      if (val && digits.length < 7) {
        el.style.borderColor = 'var(--red-500, #ef4444)';
        valid = false;
        if (!firstError) firstError = el;
        return;
      }
    }
    el.style.borderColor = '';
  });
  if (!valid && firstError) {
    firstError.focus();
    if (typeof showToast === 'function') {
      showToast('Lütfen zorunlu alanları doğru şekilde doldurun.', 'error');
    } else {
      alert('Lütfen zorunlu alanları doğru şekilde doldurun.');
    }
  }
  return valid;
}
function guardModals() {
  document.querySelectorAll('.modal-overlay').forEach(function(m) {
    if (!m.classList.contains('active')) {
      m.style.opacity = '0';
      m.style.visibility = 'hidden';
    }
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      document.querySelectorAll('.modal-overlay.active').forEach(function(m) {
        m.classList.remove('active');
        m.style.opacity = '0';
        m.style.visibility = 'hidden';
      });
    }
  });
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', guardModals);
} else {
  guardModals();
}
</style>
</script>
