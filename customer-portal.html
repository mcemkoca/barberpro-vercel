<!DOCTYPE html><html lang="tr" data-theme="dark"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="meta_barberpro_online_randevu" data-i18n-attr="content">BarberPro — Online Randevu</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#a855f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BarberPro">
<link rel="apple-touch-icon" href="assets/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
<style>
/* ── Purple Theme Overrides ── */
:root, [data-theme="dark"] {
  --teal-50: #f0fdfa;
  --teal-100: #ccfbf1;
  --teal-200: #c4b5fd;
  --teal-300: #c4b5fd;
  --teal-400: #a78bfa;
  --teal-500: #8b5cf6;
  --teal-600: #7c3aed;
  --teal-700: #6d28d9;
  --teal-800: #6d28d9;
  --teal-900: #6d28d9;
  --amber-500: #f59e0b;
  --amber-600: #d97706;
  --shadow-glow: rgba(139,92,246,0.25);
}
[data-theme="dark"] ::selection { background:var(--purple-700,#6d28d9); color:var(--purple-100,#ede9fe); }

body { background:var(--bg-primary); min-height:100vh; }

/* ── Header ── */
.portal-header {
  height:64px; background:var(--bg-card); border-bottom:1px solid var(--border-color);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 var(--space-6); position:sticky; top:0; z-index:50;
  backdrop-filter:blur(12px); background:rgba(15,23,42,0.9);
}
.portal-header-left { display:flex; align-items:center; gap:var(--space-3); }
.portal-logo {
  width:36px; height:36px; background:linear-gradient(135deg,var(--teal-500),var(--teal-700));
  border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center;
  font-size:16px; font-weight:700; color:white;
}
.portal-header-title { font-size:var(--text-base); font-weight:700; letter-spacing:-0.02em; }
.portal-header-right { display:flex; align-items:center; gap:var(--space-3); }
.portal-btn {
  padding:8px 16px; border-radius:var(--radius-md); font-size:var(--text-sm); font-weight:600;
  border:1px solid var(--border-color); background:var(--bg-secondary); color:var(--text-secondary);
  cursor:pointer; transition:all var(--duration-fast);
}
.portal-btn:hover { border-color:var(--teal-500); color:var(--teal-500); }
.portal-btn-primary {
  background:linear-gradient(135deg,var(--teal-500),var(--teal-700)); color:white; border:none;
}
.portal-btn-primary:hover { box-shadow:0 0 20px var(--shadow-glow); transform:translateY(-1px); }

/* ── Lang Switcher ── */
.lang-switcher {
  display:flex; gap:4px; align-items:center;
  background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius-md);
  padding:3px;
}
.lang-btn {
  padding:4px 10px; border-radius:var(--radius-sm); border:none; background:transparent;
  font-size:0.75rem; font-weight:600; color:var(--text-muted); cursor:pointer; transition:all var(--duration-fast);
}
.lang-btn:hover { color:var(--text-primary); }
.lang-btn.active { background:var(--teal-600); color:white; }

/* ── Hero ── */
.hero {
  background:linear-gradient(135deg,rgba(139,92,246,0.08),rgba(124,58,237,0.04));
  border-bottom:1px solid var(--border-color); padding:var(--space-12) var(--space-6);
  text-align:center; position:relative; overflow:hidden;
}
.hero::before {
  content:''; position:absolute; inset:0; background:radial-gradient(circle at 50% 50%,rgba(139,92,246,0.08) 0%,transparent 60%);
  pointer-events:none;
}
.hero-inner { position:relative; z-index:1; max-width:640px; margin:0 auto; }
.hero-badge {
  display:inline-flex; align-items:center; gap:6px; padding:6px 14px;
  background:rgba(139,92,246,0.12); border:1px solid rgba(139,92,246,0.2);
  border-radius:9999px; font-size:var(--text-xs); font-weight:600; color:var(--teal-400);
  margin-bottom:var(--space-5);
}
.hero h1 { font-size:36px; font-weight:800; letter-spacing:-0.03em; line-height:1.15; margin-bottom:var(--space-4); }
.hero p { font-size:var(--text-lg); color:var(--text-muted); margin-bottom:var(--space-6); line-height:1.6; }
.hero-rating {
  display:flex; align-items:center; justify-content:center; gap:var(--space-4);
  margin-bottom:var(--space-6);
}
.stars { display:flex; gap:2px; color:var(--amber-500); font-size:var(--text-lg); }
.hero-address { font-size:var(--text-sm); color:var(--text-muted); display:flex; align-items:center; gap:6px; justify-content:center; }

/* ── Steps ── */
.steps-bar {
  display:flex; align-items:center; justify-content:center; gap:var(--space-2);
  padding:var(--space-5) var(--space-6); border-bottom:1px solid var(--border-color);
  background:var(--bg-card); position:sticky; top:64px; z-index:40;
}
.step {
  display:flex; align-items:center; gap:var(--space-2); font-size:var(--text-sm); font-weight:600;
  color:var(--text-muted); transition:all var(--duration-fast);
}
.step-circle {
  width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700; background:var(--bg-tertiary); color:var(--text-muted);
  border:2px solid var(--border-color); transition:all var(--duration-fast);
}
.step.active .step-circle { background:var(--teal-500); border-color:var(--teal-500); color:white; }
.step.completed .step-circle { background:var(--success-500); border-color:var(--success-500); color:white; }
.step.active { color:var(--teal-400); }
.step.completed { color:var(--success-500); }
.step-line { width:24px; height:2px; background:var(--border-color); border-radius:1px; }
.step-line.completed { background:var(--success-500); }

/* ── Content Sections ── */
.portal-content { max-width:900px; margin:0 auto; padding:var(--space-8) var(--space-6); }
.section { margin-bottom:var(--space-8); }
.section-title { font-size:var(--text-2xl); font-weight:700; margin-bottom:var(--space-2); }
.section-subtitle { font-size:var(--text-sm); color:var(--text-muted); margin-bottom:var(--space-5); }

/* ── Service Cards ── */
.service-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-4); }
.service-card {
  background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius-lg);
  padding:var(--space-5); cursor:pointer; transition:all var(--duration-normal);
  position:relative;
}
.service-card:hover { border-color:rgba(139,92,246,0.3); transform:translateY(-3px); }
.service-card.selected { border-color:var(--teal-500); box-shadow:0 0 24px rgba(139,92,246,0.1); }
.service-card.selected::after {
  content:'✓'; position:absolute; top:12px; right:12px;
  width:24px; height:24px; border-radius:50%;
  background:var(--teal-500); color:white; display:flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:700;
}
.service-icon {
  width:44px; height:44px; border-radius:var(--radius-md);
  display:flex; align-items:center; justify-content:center; font-size:var(--text-xl); margin-bottom:var(--space-3);
}
.service-card h3 { font-size:var(--text-base); font-weight:600; margin-bottom:4px; }
.service-card p { font-size:var(--text-xs); color:var(--text-muted); margin-bottom:var(--space-3); }
.service-meta { display:flex; align-items:center; gap:var(--space-3); font-size:var(--text-sm); color:var(--text-secondary); }
.service-price { font-size:var(--text-lg); font-weight:700; color:var(--teal-400); margin-left:auto; }

/* ── Staff Cards ── */
.staff-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:var(--space-4); }
.staff-card {
  background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius-lg);
  padding:var(--space-5); text-align:center; cursor:pointer; transition:all var(--duration-normal);
  position:relative;
}
.staff-card:hover { border-color:rgba(139,92,246,0.3); transform:translateY(-3px); }
.staff-card.selected { border-color:var(--teal-500); box-shadow:0 0 24px rgba(139,92,246,0.1); }
.staff-card.selected::after {
  content:'✓'; position:absolute; top:12px; right:12px;
  width:24px; height:24px; border-radius:50%;
  background:var(--teal-500); color:white; display:flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:700;
}
.staff-avatar {
  width:72px; height:72px; border-radius:50%; margin:0 auto var(--space-3);
  display:flex; align-items:center; justify-content:center; font-size:var(--text-2xl); font-weight:700; color:white;
}
.staff-card h3 { font-size:var(--text-sm); font-weight:600; margin-bottom:2px; }
.staff-card .role { font-size:var(--text-xs); color:var(--text-muted); margin-bottom:var(--space-2); }
.staff-card .rating { font-size:var(--text-xs); color:var(--amber-500); margin-bottom:var(--space-1); }
.staff-card .availability { font-size:var(--text-xs); color:var(--success-500); }

/* ── Calendar ── */
.calendar-card {
  background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius-lg);
  padding:var(--space-5);
}
.calendar-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--space-4); }
.calendar-header h3 { font-size:var(--text-lg); font-weight:600; }
.cal-nav {
  display:flex; align-items:center; gap:var(--space-2);
}
.cal-nav button {
  width:32px; height:32px; border-radius:var(--radius-md); background:var(--bg-secondary); border:1px solid var(--border-color);
  color:var(--text-secondary); cursor:pointer; transition:all var(--duration-fast); display:flex; align-items:center; justify-content:center;
}
.cal-nav button:hover { color:var(--teal-500); border-color:var(--teal-500); }
.calendar-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.cal-day-label { text-align:center; font-size:var(--text-xs); font-weight:600; color:var(--text-muted); padding:var(--space-2); }
.cal-day {
  aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  border-radius:var(--radius-md); font-size:var(--text-sm); font-weight:500;
  cursor:pointer; transition:all var(--duration-fast); background:var(--bg-secondary); border:1px solid transparent;
  position:relative;
}
.cal-day:hover:not(.disabled):not(.selected) { border-color:var(--teal-500); color:var(--teal-400); }
.cal-day.selected { background:var(--teal-500); color:white; border-color:var(--teal-500); }
.cal-day.disabled { opacity:0.3; cursor:not-allowed; }
.cal-day.today { border-color:var(--amber-500); }
.cal-day .slots { font-size:10px; color:var(--success-500); margin-top:2px; }
.cal-day.selected .slots { color:rgba(255,255,255,0.7); }

/* ── Time Slots ── */
.time-section { margin-top:var(--space-5); }
.time-section h4 { font-size:var(--text-sm); font-weight:600; margin-bottom:var(--space-3); }
.time-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:var(--space-2); }
.time-slot {
  padding:10px var(--space-3); border-radius:var(--radius-md); text-align:center;
  font-size:var(--text-sm); font-weight:500; cursor:pointer; transition:all var(--duration-fast);
  background:var(--bg-secondary); border:1px solid var(--border-color); color:var(--text-secondary);
}
.time-slot:hover:not(.disabled):not(.selected) { border-color:var(--teal-500); color:var(--teal-400); }
.time-slot.selected { background:var(--teal-500); border-color:var(--teal-500); color:white; }
.time-slot.disabled { opacity:0.3; cursor:not-allowed; text-decoration:line-through; }

/* ── Form ── */
.form-card {
  background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius-lg);
  padding:var(--space-6);
}
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:var(--space-4); }

/* ── Summary ── */
.summary-card {
  background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius-lg);
  padding:var(--space-6);
}
.summary-line { display:flex; justify-content:space-between; padding:var(--space-2) 0; border-bottom:1px dashed var(--border-color); font-size:var(--text-sm); }
.summary-line:last-of-type { border-bottom:none; }
.summary-line.total { border-top:2px solid var(--border-color); border-bottom:none; margin-top:var(--space-3); padding-top:var(--space-3); font-size:var(--text-lg); font-weight:700; }
.summary-line .label { color:var(--text-muted); }
.summary-line .value { color:var(--text-primary); font-weight:600; }
.summary-line.total .value { color:var(--teal-400); font-size:var(--text-xl); }

/* ── Contact Section ── */
.contact-section {
  background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius-lg);
  padding:var(--space-6); margin-top:var(--space-8);
}
.contact-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-5); margin-top:var(--space-4); }
.contact-item { display:flex; flex-direction:column; gap:var(--space-1); }
.contact-item .label { font-size:var(--text-xs); color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em; }
.contact-item .value { font-size:var(--text-sm); font-weight:600; color:var(--text-primary); }
.map-placeholder {
  height:200px; background:var(--bg-secondary); border-radius:var(--radius-lg);
  display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-size:var(--text-sm);
  margin-top:var(--space-4); border:1px dashed var(--border-color);
}

/* ── My Appointments ── */
.appt-list { display:flex; flex-direction:column; gap:var(--space-3); }
.appt-card {
  background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius-lg);
  padding:var(--space-4); display:flex; align-items:center; gap:var(--space-4); transition:all var(--duration-fast);
}
.appt-card:hover { border-color:rgba(139,92,246,0.3); }
.appt-date {
  width:60px; text-align:center; flex-shrink:0;
}
.appt-date .day { font-size:var(--text-2xl); font-weight:800; color:var(--teal-400); line-height:1; }
.appt-date .month { font-size:var(--text-xs); color:var(--text-muted); text-transform:uppercase; }
.appt-info { flex:1; }
.appt-info h4 { font-size:var(--text-sm); font-weight:600; margin-bottom:2px; }
.appt-info p { font-size:var(--text-xs); color:var(--text-muted); }
.appt-status { font-size:var(--text-xs); font-weight:600; padding:4px 12px; border-radius:9999px; }
.appt-status.upcoming { background:rgba(139,92,246,0.12); color:var(--teal-400); }
.appt-status.completed { background:rgba(16,185,129,0.12); color:var(--success-500); }

/* ── Modals ── */
.modal-overlay {
  position:fixed; inset:0; z-index:1000;
  background:rgba(0,0,0,0.7); backdrop-filter:blur(4px);
  display:flex; align-items:center; justify-content:center;
  padding:var(--space-4); opacity:0; visibility:hidden;
  transition:opacity var(--duration-normal), visibility var(--duration-normal);
}
.modal-overlay.active { opacity:1; visibility:visible; }
.modal {
  background:var(--bg-card); border:1px solid var(--border-color);
  border-radius:var(--radius-xl); width:100%; max-width:480px;
  max-height:90vh; overflow:auto;
  transform:scale(0.95) translateY(20px); opacity:0;
  transition:transform var(--duration-slow) var(--ease-spring), opacity var(--duration-slow);
  box-shadow:var(--shadow-xl);
}
.modal-overlay.active .modal { transform:scale(1) translateY(0); opacity:1; }
.modal-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:var(--space-5) var(--space-6); border-bottom:1px solid var(--border-color);
}
.modal-title { font-size:var(--text-lg); font-weight:700; }
.modal-close {
  width:32px; height:32px; border-radius:var(--radius-md);
  display:flex; align-items:center; justify-content:center;
  color:var(--text-muted); transition:all var(--duration-fast);
  background:var(--bg-secondary); border:none; cursor:pointer;
}
.modal-close:hover { background:var(--error-100); color:var(--error-500); }
.modal-body { padding:var(--space-6); }
.modal-footer {
  display:flex; align-items:center; justify-content:flex-end; gap:var(--space-3);
  padding:var(--space-4) var(--space-6); border-top:1px solid var(--border-color);
  background:var(--bg-secondary); border-radius:0 0 var(--radius-xl) var(--radius-xl);
}

/* ── Confirmation Modal ── */
.confirm-icon {
  width:64px; height:64px; border-radius:50%; background:var(--success-100);
  display:flex; align-items:center; justify-content:center; font-size:var(--text-2xl); margin:0 auto var(--space-4);
}
.confirm-code {
  background:var(--bg-secondary); border:1px dashed var(--border-color); border-radius:var(--radius-md);
  padding:var(--space-3) var(--space-4); text-align:center; font-size:var(--text-xl); font-weight:700;
  color:var(--teal-400); letter-spacing:2px; margin-bottom:var(--space-4);
}

/* ── Footer ── */
.portal-footer {
  border-top:1px solid var(--border-color); padding:var(--space-6);
  display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:var(--space-4);
  max-width:900px; margin:0 auto;
}
.footer-links { display:flex; gap:var(--space-4); }
.footer-links a { font-size:var(--text-sm); color:var(--text-muted); transition:color var(--duration-fast); }
.footer-links a:hover { color:var(--teal-400); }

/* ── Responsive ── */
@media (max-width:768px) {
  .service-grid { grid-template-columns:1fr; }
  .staff-grid { grid-template-columns:repeat(2,1fr); }
  .form-row { grid-template-columns:1fr; }
  .contact-grid { grid-template-columns:1fr; }
  .time-grid { grid-template-columns:repeat(3,1fr); }
  .hero h1 { font-size:28px; }
  .steps-bar { overflow-x:auto; justify-content:flex-start; }
  .portal-content { padding:var(--space-4); }
}


<style>
/* ── Mobile Responsive Overrides (Stages 5+7) ── */
@media (max-width:1024px) {
  .sidebar { transform:translateX(-100%); width:var(--sidebar-width); }
  .sidebar.mobile-open { transform:translateX(0); }
  .main { margin-left:0 !important; }
  .header-search { display:none; }
  .widget-grid-4 { grid-template-columns:repeat(2,1fr); }
  .widget-grid-3 { grid-template-columns:repeat(2,1fr); }
}

@media (max-width:768px) {
  .page { padding:var(--space-4) var(--space-3); }
  .page-header { flex-direction:column; gap:var(--space-3); }
  .page-actions { width:100%; }
  .page-actions .btn { flex:1; min-height:44px; font-size:var(--text-sm); }
  .header { padding:0 var(--space-3); }
  .header-title { font-size:var(--text-base); }
  .widget-grid-4, .widget-grid-3, .widget-grid-2 { grid-template-columns:1fr; }
  .chart-container { height:200px; }
  .quick-actions { gap:var(--space-2); }
  .quick-action { flex:1; min-width:0; justify-content:center; min-height:44px; }
  /* Tables: scroll wrapper */
  .data-table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .data-table { min-width:640px; }
  .notifications-panel { width:100%; max-width:380px; }
  /* Touch-friendly */
  .btn, .header-btn, .sidebar-link, .quick-action { min-height:44px; }
}

@media (max-width:375px) {
  body { font-size:14px; }
  .page { padding:var(--space-3) var(--space-2); }
  .page-title { font-size:var(--text-xl); }
  .btn { padding:10px 12px; font-size:14px; min-height:44px; }
  .header-btn { width:40px; height:40px; }
  .card { padding:var(--space-4); }
  .stat-value { font-size:var(--text-xl); }
  .chart-container { height:180px; }
  .sidebar-brand-icon { width:48px; height:48px; background:linear-gradient(135deg,var(--teal-500),var(--teal-700)); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:700; color:white; flex-shrink:0; box-shadow:0 2px 8px var(--teal-glow); }
  .quick-action { font-size:13px; padding:var(--space-2) var(--space-3); }
}

/* Card view tables on very small screens */
@media (max-width:640px) {
  .data-table tbody tr {
    display:flex; flex-direction:column; padding:var(--space-3);
    border-bottom:1px solid var(--border-color); gap:4px;
  }
  .data-table tbody td { padding:2px 0; white-space:normal; font-size:14px; }
  .data-table thead { display:none; }
  .data-table tbody td::before {
    content: attr(data-label); font-weight:600; color:var(--text-muted);
    font-size:12px; display:block; margin-bottom:2px;
  }
}

</head>
<body>

<!-- Header -->
<header class="portal-header">
  <div class="portal-header-left">
    <div class="portal-logo" data-i18n="div_b">B</div>
    <span class="portal-header-title" data-i18n="span_barberpro">BarberPro</span>
  </div>

<script>
/* ── Selection State ── */
let selectedServices = [];
let selectedStaff = null;
let selectedDate = null;
let selectedTime = null;

/* ── Service Selection ── */
function selectService(card, name, price, duration) {
  card.classList.toggle('selected');
  const idx = selectedServices.findIndex(s => s.name === name);
  if (idx >= 0) {
    selectedServices.splice(idx, 1);
  } else {
    selectedServices.push({ name, price, duration });
  }
  document.getElementById('step1Btn').disabled = selectedServices.length === 0;
}

/* ── Staff Selection ── */
function selectStaff(card, name) {
  document.querySelectorAll('.staff-card').forEach(c => c.classList.remove('selected'));
  card.classList.add('selected');
  selectedStaff = name;
  document.getElementById('step2Btn').disabled = false;
}

/* ── Date Selection ── */
function selectDate(el, day) {
  document.querySelectorAll('.cal-day').forEach(d => d.classList.remove('selected'));
  el.classList.add('selected');
  selectedDate = day;
  document.getElementById('timeSection').style.display = 'block';
  document.getElementById('timeSection').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  checkDateTimeReady();
}

/* ── Time Selection ── */
function selectTime(el, time) {
  if (el.classList.contains('disabled')) return;
  document.querySelectorAll('.time-slot').forEach(t => t.classList.remove('selected'));
  el.classList.add('selected');
  selectedTime = time;
  checkDateTimeReady();
}

function checkDateTimeReady() {
  document.getElementById('step3Btn').disabled = !(selectedDate && selectedTime);
}

/* ── Step Navigation ── */
function nextStep(current) {
  const sections = ['serviceSection', 'staffSection', 'dateSection', 'confirmSection'];
  const steps = ['step1', 'step2', 'step3', 'step4'];
  const lines = ['line1', 'line2', 'line3'];

  document.getElementById(sections[current - 1]).style.display = 'none';
  document.getElementById(sections[current]).style.display = 'block';

  document.getElementById(steps[current - 1]).classList.remove('active');
  document.getElementById(steps[current - 1]).classList.add('completed');
  document.getElementById(steps[current]).classList.add('active');
  if (lines[current - 1]) {
    document.getElementById(lines[current - 1]).classList.add('completed');
  }

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function prevStep(current) {
  const sections = ['serviceSection', 'staffSection', 'dateSection', 'confirmSection'];
  const steps = ['step1', 'step2', 'step3', 'step4'];
  const lines = ['line1', 'line2', 'line3'];

  document.getElementById(sections[current - 1]).style.display = 'none';
  document.getElementById(sections[current - 2]).style.display = 'block';

  document.getElementById(steps[current - 1]).classList.remove('active');
  document.getElementById(steps[current - 2]).classList.remove('completed');
  document.getElementById(steps[current - 2]).classList.add('active');
  if (lines[current - 2]) {
    document.getElementById(lines[current - 2]).classList.remove('completed');
  }

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ── Modal ── */
function openModal(id) {
  document.getElementById(id).classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeModal(id) {
  document.getElementById(id).classList.remove('active');
  document.body.style.overflow = '';
}

/* ── Toast ── */
function showToast(msg, type = 'success', dur = 3000) {
  const c = document.createElement('div');
  c.style.cssText = 'position:fixed;top:80px;right:24px;z-index:2000;display:flex;flex-direction:column;gap:12px;pointer-events:none;max-width:360px;';
  const t = document.createElement('div');
  const colors = { success: 'var(--success-500)', error: 'var(--error-500)', warning: 'var(--warning-500)', info: 'var(--info-500)' };
  const icons = { success: '✓', error: '✕', warning: '!', info: 'ℹ' };
  t.style.cssText = `pointer-events:all;background:var(--bg-card);border:1px solid ${colors[type]};border-radius:12px;padding:14px 18px;display:flex;align-items:flex-start;gap:12px;box-shadow:var(--shadow-lg);animation:toastIn 0.3s ease-out;position:relative;overflow:hidden;`;
  t.innerHTML = `<span style="flex-shrink:0;margin-top:2px;width:20px;height:20px;border-radius:50%;background:${colors[type]};color:var(--bg-elevated);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;">${icons[type]}</span><div style="flex:1;"><div style="font-weight:600;font-size:var(--text-sm);">${type === 'success' ? 'Başarılı' : type === 'error' ? 'Hata' : 'Bilgi'}</div><div style="font-size:var(--text-sm);color:var(--text-muted);margin-top:2px;">${msg}</div></div><span style="flex-shrink:0;color:var(--text-muted);cursor:pointer;font-size:14px;" onclick="this.parentElement.remove()">✕</span><div style="position:absolute;bottom:0;left:0;height:2px;background:${colors[type]};animation:progressBar ${dur}ms linear forwards;width:100%;"></div>`;
  c.appendChild(t); document.body.appendChild(c);
  setTimeout(() => { t.style.animation = 'toastOut 0.3s ease-in forwards'; setTimeout(() => c.remove(), 300); }, dur);
}
</script>

<style>
@keyframes toastIn { from { opacity:0; transform:translateY(-20px) scale(0.95); } to { opacity:1; transform:translateY(0) scale(1); } }
@keyframes toastOut { from { opacity:1; transform:translateY(0) scale(1); } to { opacity:0; transform:translateY(-20px) scale(0.95); } }
@keyframes progressBar { from { width:100%; } to { width:0; } }
</style>

let currentLang = localStorage.getItem('barberpro_lang') || 'tr';
function switchLang(lang) {
  currentLang = lang;
  localStorage.setItem('barberpro_lang', lang);
  document.documentElement.lang = lang;
  applyTranslations();
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
}
function applyTranslations() {
  const dict = i18n[currentLang];
  if (!dict) return;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    const attr = el.dataset.i18nAttr;
    const val = dict[key];
    if (val === undefined) return;
    if (attr) { el.setAttribute(attr, val); }
    else if (el.tagName === 'TITLE') { el.textContent = val; }
    else { el.textContent = val; }
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.dataset.i18nPlaceholder;
    if (dict[key] !== undefined) el.placeholder = dict[key];
  });
}
if (!document.getElementById('lang-style')) {
  const st = document.createElement('style');
  st.id = 'lang-style';
  st.textContent = '.lang-btn.active{background:var(--teal-600)!important;color:white!important;}.lang-btn:hover{color:var(--text-primary)!important;}';
  document.head.appendChild(st);
}
switchLang(currentLang);

<!-- ===== FORM VALIDATION & MODAL GUARD ===== -->
<script>
function validateFormInputs(container) {
  const root = typeof container === 'string' ? document.getElementById(container) : container;
  if (!root) return true;
  const inputs = root.querySelectorAll('input, select, textarea');
  let valid = true;
  let firstError = null;
  const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  inputs.forEach(function(el) {
    const isRequired = el.hasAttribute('required') || el.dataset.required === 'true';
    const val = el.value ? el.value.trim() : '';
    if (isRequired && !val) {
      el.style.borderColor = 'var(--red-500, #ef4444)';
      valid = false;
      if (!firstError) firstError = el;
      return;
    }
    if (el.type === 'email' || el.dataset.validate === 'email') {
      if (val && !emailRe.test(val)) {
        el.style.borderColor = 'var(--red-500, #ef4444)';
        valid = false;
        if (!firstError) firstError = el;
        return;
      }
    }
    if (el.type === 'tel' || el.dataset.validate === 'phone') {
      const digits = val.replace(/\D/g, '');
      if (val && digits.length < 7) {
        el.style.borderColor = 'var(--red-500, #ef4444)';
        valid = false;
        if (!firstError) firstError = el;
        return;
      }
    }
    el.style.borderColor = '';
  });
  if (!valid && firstError) {
    firstError.focus();
    if (typeof showToast === 'function') {
      showToast('Lütfen zorunlu alanları doğru şekilde doldurun.', 'error');
    } else {
      alert('Lütfen zorunlu alanları doğru şekilde doldurun.');
    }
  }
  return valid;
}
function guardModals() {
  document.querySelectorAll('.modal-overlay').forEach(function(m) {
    if (!m.classList.contains('active')) {
      m.style.opacity = '0';
      m.style.visibility = 'hidden';
    }
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      document.querySelectorAll('.modal-overlay.active').forEach(function(m) {
        m.classList.remove('active');
        m.style.opacity = '0';
        m.style.visibility = 'hidden';
      });
    }
  });
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', guardModals);
} else {
  guardModals();
}
